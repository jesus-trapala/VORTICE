const Game = {
  state:'title',
  player:null, enemies:[], bullets:[], eBullets:[], pickups:[],
  score:0, best:0, wave:0, lives:3, mult:1, multT:0, killStreak:0,
  time:0, shake:0, hitStop:0, spawnQueue:[], spawnTimer:0, waveBreak:0,
  muted:false, diff:DIFFS.normal, diffKey:'normal', shipIdx:4,
  menuShip:4, menuDiff:'normal', mode:'normal', unlocked:[],
  extraLives:0, MAX_EXTRA:5, padOn:false,
  // roguelite
  up:{}, upOrder:[], maxLivesBonus:0, trail:[],
  cards:[], cardSel:0, cardT:0, cardsFor:0,
  stats:{shots:0,hits:0},
  bossesSeen:0, bossMax:0, bossInfo:null,
  bombCharge:0, bombs:0, rings:[], flash:0,
  vortex:null, vortexTimer:0, vortexRng:Math.random,
  goldT:0, event:null, eventT:0,

  /** cuantas veces se eligio una mejora */
  upN(id){ return this.up[id]||0; },

  init(){
    Save.load();
    const S=Save.data;
    const mi=SHIPS.findIndex(s=>s.id===S.menu.ship);
    this.menuShip = mi>=0 && this.shipUnlocked(SHIPS[mi]) ? mi : 4;
    this.menuDiff = DIFFS[S.menu.diff] ? S.menu.diff : 'normal';
    this.muted=!!S.muted; Audio_.muted=this.muted;
    resize();
    Grid.inst = new Grid();
    this.player = new Player();
    Input.init(cv);
    addEventListener('resize',()=>{ resize(); Grid.inst.build(); });
    this.buildMenus();
    document.getElementById('startBtn').addEventListener('click',()=>this.start('normal'));
    document.getElementById('dailyBtn').addEventListener('click',()=>this.start('daily'));
    document.getElementById('copyBtn').addEventListener('click',()=>this.copyResult());
    document.getElementById('shareBtn').addEventListener('click',()=>this.shareResult());
    this.updateDailyInfo();
    document.getElementById('againBtn').addEventListener('click',()=>this.start());
    document.getElementById('menuBtn').addEventListener('click',()=>this.toMenu());
    document.getElementById('resumeBtn').addEventListener('click',()=>this.togglePause());
    document.getElementById('pauseBtn').addEventListener('click',()=>this.togglePause());
    const bb=document.getElementById('bombBtn');
    bb.addEventListener('pointerdown',e=>{ e.preventDefault(); e.stopPropagation(); this.useBomb(); });
    bb.addEventListener('keydown',e=>{ if(e.code==='Enter') this.useBomb(); });

    // Pausa automatica: si sales de la app o cambias de pestana, el juego se detiene.
    const autoPause=()=>{ if(this.state==='playing') this.togglePause(); };
    document.addEventListener('visibilitychange',()=>{ if(document.hidden) autoPause(); });
    addEventListener('blur',autoPause);
    addEventListener('gamepadconnected',()=>Pad.poll());
    this.hintBase = IS_COARSE
      ? 'Pulgar <b>izquierdo</b> para mover \u00b7 pulgar <b>derecho</b> para apuntar y disparar \u00b7 <b>doble toque</b> izquierdo: impulso \u00b7 bot\u00f3n <b>BOMBA</b> abajo al centro'
      : '<kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> <b>mover</b> \u00b7 <b>rat\u00f3n</b> apuntar \u00b7 <b>clic</b> disparar \u00b7 <kbd>May\u00fas</kbd> impulso \u00b7 <kbd>Espacio</kbd> bomba \u00b7 <kbd>P</kbd> pausa';
    document.getElementById('ctrlHint').innerHTML = this.hintBase;
    document.getElementById('hint').textContent = this.hintText();
    requestAnimationFrame(loop);
  },

  buildMenus(){
    const dr=document.getElementById('diffRow');
    for(const k of ['facil','normal','intenso']){
      const b=document.createElement('button');
      b.className='pick'; b.type='button'; b.textContent=DIFFS[k].name; b.dataset.k=k;
      b.addEventListener('click',()=>{
        this.menuDiff=k; Save.data.menu.diff=k; Save.save();
        this.markMenu();
        Audio_.init(); Audio_.tone('square',520,780,.09,.09);
      });
      dr.appendChild(b);
    }
    const sr=document.getElementById('shipRow');
    SHIPS.forEach((sh,i)=>{
      const b=document.createElement('button');
      b.className='ship'; b.type='button';
      const cvp=document.createElement('canvas');
      cvp.width=cvp.height=124;
      const c2=cvp.getContext('2d');
      c2.translate(62,62); c2.rotate(-Math.PI/2); c2.scale(2.5,2.5);
      drawShip(c2,sh,0,true);
      b.appendChild(cvp);
      const nm=document.createElement('div'); nm.className='nm';
      const who=document.createElement('div'); who.className='who';
      const tr=document.createElement('div'); tr.className='tr';
      b.append(nm,who,tr);
      b._nm=nm; b._who=who; b._tr=tr;
      b.addEventListener('click',()=>{
        Audio_.init();
        if(!this.shipUnlocked(sh)){
          // bloqueada: sacudida y sonido de "no"
          b.classList.remove('deny'); void b.offsetWidth; b.classList.add('deny');
          Audio_.tone('square',220,140,.16,.1);
          return;
        }
        this.menuShip=i; Save.data.menu.ship=sh.id; Save.save();
        this.markMenu();
        Audio_.tone('triangle',400,700,.12,.1);
      });
      sr.appendChild(b);
    });
    this.markMenu();
  },

  /* ---------------- progresion y desbloqueos ---------------- */
  shipUnlocked(sh){
    if(!sh.lock) return true;
    const S=Save.data;
    return sh.lock.type==='wave' ? S.maxWave>=sh.lock.n : S.bossKills>=sh.lock.n;
  },
  lockProgress(sh){
    const S=Save.data;
    const have = sh.lock.type==='wave' ? S.maxWave : S.bossKills;
    return sh.lock.text+' ('+Math.min(have,sh.lock.n)+'/'+sh.lock.n+')';
  },
  recordKey(shipIdx,diffKey){ return SHIPS[shipIdx].id+'|'+diffKey; },
  /** pinta selector de nave/dificultad y el record de la combinacion elegida */
  markMenu(){
    for(const b of document.getElementById('diffRow').children)
      b.setAttribute('aria-pressed', b.dataset.k===this.menuDiff ? 'true':'false');
    const sr=document.getElementById('shipRow');
    SHIPS.forEach((sh,i)=>{
      const b=sr.children[i], open=this.shipUnlocked(sh), on=i===this.menuShip;
      b.classList.toggle('locked',!open);
      b.setAttribute('aria-pressed', on ? 'true':'false');
      b.style.borderColor = on ? sh.color : '';
      b._nm.textContent = (!open && sh.secret) ? '???' : sh.name;
      b._nm.style.color = open ? sh.color : '';
      b._who.textContent = open ? sh.who : 'Bloqueada';
      b._tr.textContent = open ? sh.trait : this.lockProgress(sh);
    });
    const rec=Save.data.records[this.recordKey(this.menuShip,this.menuDiff)]||0;
    document.getElementById('titleRec').innerHTML = rec
      ? 'Récord con '+SHIPS[this.menuShip].name+' en '+DIFFS[this.menuDiff].name+': <b>'+rec.toLocaleString('es-MX')+'</b>'
      : 'Sin récord con '+SHIPS[this.menuShip].name+' en '+DIFFS[this.menuDiff].name;
  },
  /** se guarda en cuanto ocurre, aunque la partida no termine */
  noteProgress(){
    const S=Save.data, before=SHIPS.filter(s=>this.shipUnlocked(s)).map(s=>s.id);
    if(this.wave>S.maxWave) S.maxWave=this.wave;
    Save.save();
    for(const sh of SHIPS){
      if(!before.includes(sh.id) && this.shipUnlocked(sh)){
        this.banner('Nave desbloqueada',sh.name+' · '+sh.trait,sh.color);
        this.unlocked.push(sh.name);
        Audio_.power();
      }
    }
  },

  /** Se llama al conectar o desconectar un mando. */
  onPadChange(on){
    this.padOn=on; this._bombUI="";
    document.getElementById('ctrlHint').innerHTML = on
      ? '<b>Mando conectado</b> \u00b7 <b>A</b> iniciar \u00b7 <b>Y</b> reto diario \u00b7 stick izquierdo mover \u00b7 stick derecho apuntar y disparar \u00b7 <b>B</b> impulso \u00b7 <b>LB</b> bomba \u00b7 <b>Start</b> pausa'
      : this.hintBase;
    document.getElementById('hint').textContent = this.hintText();
    if(on) Audio_.tone('square',420,880,.16,.12);
  },

  async goFullscreen(){
    if(!IS_COARSE) return;
    try{
      const el=document.documentElement;
      if(!document.fullscreenElement && el.requestFullscreen) await el.requestFullscreen({navigationUI:'hide'});
      if(screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape');
    }catch(e){ /* el navegador puede negarlo; seguimos igual */ }
  },

  toMenu(){
    this.state='title';
    this.enemies.length=0; this.bullets.length=0; this.eBullets.length=0; this.pickups.length=0;
    this.markMenu(); this.updateDailyInfo();
    show('deadScreen',false); show('titleScreen',true);
    document.getElementById('hud').classList.remove('on');
    Audio_.setIntensity(0);
  },

  start(mode){
    Audio_.init(); Audio_.resume(); this.goFullscreen();
    if(mode===undefined) mode=this.mode||'normal';
    this.mode=mode;
    if(mode==='daily'){
      // reto diario: nave, dificultad y azar fijos para todos ese dia
      const D=Daily.config();
      this.dailyDate=D.date;
      this.shipIdx=D.shipIdx; this.diffKey=D.diff;
      RNG.set(D.seed);
    } else {
      this.shipIdx=this.menuShip; this.diffKey=this.menuDiff;
      RNG.set(null);
    }
    this.diff=DIFFS[this.diffKey];
    this.spawnRng=null;
    this.player.setShip(SHIPS[this.shipIdx]);
    this.player.reset();
    this.enemies.length=0; this.bullets.length=0; this.eBullets.length=0; this.pickups.length=0;
    Particles.clear(); Floaters.clear();
    this.score=0; this.wave=0; this.mult=1; this.multT=0; this.killStreak=0;
    this.lives=Math.max(1, SHIPS[this.shipIdx].lives + this.diff.lifeBonus);
    this.extraLives=0;
    this.up={}; this.upOrder=[]; this.maxLivesBonus=0; this.trail.length=0;
    this.cards=[]; this.cardsFor=0;
    this.stats={shots:0,hits:0};
    this.bossesSeen=0; this.bossMax=0; this.bossInfo=null;
    document.getElementById('bossBar').classList.remove('on');
    this.bombCharge=0; this.bombs=0; this.rings.length=0; this.flash=0; this._bombUI='';
    this.vortex=null; this.vortexTimer=0; Audio_.droneOff();
    this.event=null; this.goldT=0; this.updateEventTag();
    this.stats.kills={}; this.unlocked=[];
    this.shake=0; this.hitStop=0; this.spawnQueue.length=0; this.waveBreak=1.2;
    this.state='playing';
    show('titleScreen',false); show('deadScreen',false); show('pauseScreen',false); show('cardScreen',false);
    this.renderUpIcons();
    document.getElementById('hud').classList.add('on');
    this.updateHUD();
  },

  togglePause(){
    if(this.state==='playing'){ this.state='paused'; show('pauseScreen',true); Audio_.setMuted(true); }
    else if(this.state==='paused'){ this.state='playing'; show('pauseScreen',false); Audio_.setMuted(this.muted); }
  },
  hintText(){
    if(this.padOn) return this.muted ? 'Start \u00b7 pausa \u00b7 sonido apagado' : 'Start \u00b7 pausa';
    if(IS_COARSE) return this.muted ? 'Sonido apagado' : '';
    return this.muted ? 'P \u00b7 pausa \u00b7 M \u00b7 sonido apagado' : 'P \u00b7 pausa \u00b7 M \u00b7 sonido';
  },
  toggleMute(){
    this.muted=!this.muted; Audio_.setMuted(this.muted);
    Save.data.muted=this.muted; Save.save();
    document.getElementById('hint').textContent = this.hintText();
  },

  /* ---------------- cartas de mejora ---------------- */
  openCards(){
    this.cardsFor=this.wave;
    if(this.event!=='oro') this.event=null;   // el apagon termina con la oleada
    this.updateEventTag();
    if(this.vortex) this.endVortex();
    const r=RNG.sub('cartas'+this.wave);
    let pool=UPGRADES.filter(u=> this.upN(u.id)<u.max && (!u.req || u.req()));
    // barajar con el generador de la partida (igual para todos en el reto diario)
    for(let i=pool.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
    pool=pool.slice(0,3);
    while(pool.length<3) pool.push(UP_FILLER);
    this.cards=pool; this.cardSel=1; this.cardT=.55;   // breve espera: evita elegir sin querer
    this.state='cards';
    const row=document.getElementById('cardRow');
    row.innerHTML='';
    pool.forEach((u,i)=>{
      const b=document.createElement('button');
      b.type='button'; b.className='card';
      b.style.setProperty('--cc',u.color); b.style.setProperty('--cg',hexA(u.color,.45));
      const n=this.upN(u.id);
      const desc=typeof u.desc==='function'?u.desc():u.desc;
      b.innerHTML=`<span class="ck">${i+1}</span><span class="ci">${u.ab}</span>`+
        `<span class="cn">${u.name}</span><span class="cd">${desc}</span>`+
        `<span class="cs">${u.filler?'Comodín':(n?'Nivel '+n+' → '+(n+1):'Nueva')+(isFinite(u.max)?' · máx '+u.max:'')}</span>`;
      b.addEventListener('click',()=>this.pickCard(i));
      b.addEventListener('pointerenter',()=>{ this.cardSel=i; this.markCardSel(); });
      row.appendChild(b);
    });
    document.getElementById('cardTag').textContent='Oleada '+this.wave+' superada';
    document.getElementById('cardHint').innerHTML = this.padOn
      ? 'Cruceta o stick para elegir · <b>A</b> confirmar'
      : IS_COARSE ? 'Toca una carta' : 'Clic o teclas <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd>';
    this.markCardSel();
    show('cardScreen',true);
    Audio_.cards();
  },
  markCardSel(){
    const row=document.getElementById('cardRow');
    // el resaltado solo se usa con mando o teclado; con el raton manda :hover
    [...row.children].forEach((c,i)=>c.classList.toggle('sel', i===this.cardSel && (this.padOn||!IS_COARSE)));
  },
  moveCardSel(d){
    if(this.state!=='cards') return;
    this.cardSel=(this.cardSel+d+3)%3; this.markCardSel();
    Audio_.tone('triangle',500,620,.06,.06);
  },
  pickCard(i){
    if(this.state!=='cards' || this.cardT>0 || !this.cards[i]) return;
    const u=this.cards[i], p=this.player;
    if(u.filler){
      this.lives=Math.min(this.lives+1, this.maxLives());
      this.score+=1000;
    } else {
      this.up[u.id]=(this.up[u.id]||0)+1;
      this.upOrder.push(u.id);
      if(u.id==='vida'){ this.maxLivesBonus++; this.lives++; }
      if(u.id==='impulso') p.dashCd=0;
    }
    show('cardScreen',false);
    this.state='playing';
    this.waveBreak=1.0;
    Floaters.add(p.x,p.y-46,u.name.toUpperCase(),u.color,20);
    Particles.burst(p.x,p.y,Quality.pcount(30),u.color,360,.6);
    Grid.inst.impulse(p.x,p.y,200,220);
    Audio_.power();
    this.renderUpIcons(); this.updateHUD();
  },
  renderUpIcons(){
    const el=document.getElementById('upIcons');
    el.innerHTML='';
    for(const u of UPGRADES){
      const n=this.upN(u.id); if(!n) continue;
      const s=document.createElement('span');
      s.className='upi'; s.style.color=u.color; s.title=u.name;
      s.innerHTML=u.ab+(n>1?'<sub>'+n+'</sub>':'');
      el.appendChild(s);
    }
  },
  baseLives(){ return Math.max(1, SHIPS[this.shipIdx].lives + this.diff.lifeBonus); },
  maxLives(){ return this.baseLives()+this.maxLivesBonus+this.extraLives; },

  nextWave(){
    this.wave++;
    this.noteProgress();
    Audio_.waveUp();
    Audio_.setIntensity(Math.min(1,(this.wave-1)/13));
    Floaters.add(W/2,H*.36,'OLEADA '+this.wave,PAL.cyan,Math.min(46,26+this.wave));
    const w=this.wave, cm=this.diff.countMul, q=[];
    const wr=RNG.sub('oleada'+w);   // composicion y eventos: iguales para todos en el reto
    // el Vortice aparece desde la oleada 4 (posicion y momento tambien con semilla)
    this.vortexRng=RNG.sub('vortice'+w);
    this.spawnRng=RNG.sub('aparicion'+w);
    if(w>=4 && !this.vortex) this.vortexTimer=6+this.vortexRng()*8;
    const add=(t,n)=>{ n=Math.round(n*cm); for(let i=0;i<n;i++) q.push(t); };
    // ---- eventos de oleada: desde la 6, ~20%, nunca en oleada de jefe ----
    const bossWave = w % this.diff.bossEvery===0;
    this.event=null; this.eventT=0;
    if(w>=6 && !bossWave && wr()<.2){
      this.event=['apagon','lluvia','oro'][Math.floor(wr()*3)];
      const E=EVENTS[this.event];
      this.banner(E.name,E.sub,E.color);
      this.stats.events=(this.stats.events||0)+1;
      if(this.event==='oro'){ this.goldT=20; Audio_.gold(); }
      else Audio_.warn();
    }
    if(this.event==='lluvia'){
      // casi todo son esquirlas rapidas
      add('shard',  12+Math.floor(w*1.7));
      add('chaser', 2+Math.floor(w*.25));
    }else if(bossWave){
      // los tres jefes rotan: Hexarca -> Gemelo -> Embestida -> ...
      const B=BOSSES[this.bossesSeen % BOSSES.length];
      this.bossesSeen++; this.bossInfo=B;
      q.push(B.type);
      add('chaser',3+Math.floor(w/5));
      if(B.type!=='ram') add('turret',Math.min(3,Math.floor(w/5)));   // la Embestida invoca las suyas
    }else{
      add('chaser', 4+Math.floor(w*1.35));
      add('drifter',2+Math.floor(w*.62));
      if(w>=3) add('hunter', 1+Math.floor(w*.42));
      if(w>=5) add('splitter',1+Math.floor(w*.30));
      if(w>=7) add('turret', Math.floor((w-5)*.30));
    }
    for(let i=q.length-1;i>0;i--){ const j=Math.floor(wr()*(i+1)); [q[i],q[j]]=[q[j],q[i]]; }
    this.spawnQueue=q; this.spawnTimer=0;
    this.updateEventTag();
  },
  updateEventTag(){
    const el=document.getElementById('eventTag');
    let txt='', col='';
    if(this.goldT>0){ txt='Fiebre de oro '+Math.ceil(this.goldT)+'s'; col='#ffd84a'; }
    else if(this.event && this.event!=='oro'){ txt=EVENTS[this.event].name; col=EVENTS[this.event].color; }
    if(el.textContent!==txt){ el.textContent=txt; el.style.color=col; }
    document.getElementById('scoreVal').classList.toggle('gold',this.goldT>0);
  },
  drawBlackout(ctx){
    const p=this.player;
    const R=clamp(Math.min(W,H)*.27,130,240);
    const g=ctx.createRadialGradient(p.x,p.y,R*.45,p.x,p.y,R);
    g.addColorStop(0,'rgba(2,3,8,0)');
    g.addColorStop(1,`rgba(2,3,8,${.975*this.eventT})`);
    ctx.save(); ctx.fillStyle=g; ctx.fillRect(0,0,W,H); ctx.restore();
  },

  spawnOne(type){
    // las apariciones usan el generador de la oleada: en el reto salen en el mismo orden para todos
    const prevF=RNG.f; RNG.f=this.spawnRng||RNG.f;
    const m=70; let x,y,tries=0;
    do{
      const edge=grndi(4);
      if(edge===0){x=grnd(W-m,m); y=m;}
      else if(edge===1){x=W-m; y=grnd(H-m,m);}
      else if(edge===2){x=grnd(W-m,m); y=H-m;}
      else {x=m; y=grnd(H-m,m);}
      tries++;
    } while(dist2(x,y,this.player.x,this.player.y) < 210*210 && tries<24);
    const e=new Enemy(type,x,y,1+this.wave*.09);
    RNG.f=prevF;
    this.enemies.push(e);
    Grid.inst.impulse(x,y,e.isBoss?300:90,e.isBoss?260:110);
    Particles.burst(x,y,Quality.pcount(e.isBoss?34:9),e.color,e.isBoss?340:190,.4);
    if(e.isBoss){
      const B=this.bossInfo||BOSSES[0];
      this.bossMax=e.hpMax;
      const bar=document.getElementById('bossBar');
      bar.style.setProperty('--bc',e.color);
      document.getElementById('bossName').textContent=B.name;
      this.banner(B.name,'Jefe · '+B.sub,e.color);
      Audio_.warn();
    }
  },

  /** bala enemiga */
  eShot(x,y,a,spd,r,color,life){
    this.eBullets.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,life:life||3.4,r:r||5,color});
  },

  /** anuncio grande en el centro */
  banner(title,sub,color){
    const el=document.getElementById('banner');
    document.getElementById('bannerT').textContent=title;
    document.getElementById('bannerS').textContent=sub||'';
    el.style.setProperty('--bnc',color||PAL.cyan);
    el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
  },

  /** Unico punto para danar enemigos: maneja muerte y la division del Gemelo. */
  damageEnemy(e,j,dmg){
    if(e.hit(dmg)){ this.killEnemy(e,j); return true; }
    if(e.type==='twin' && e.hp<=e.hpMax*.5) this.splitTwin(e,j);
    return false;
  },

  splitTwin(e,j){
    this.enemies.splice(j,1);
    const hp=Math.ceil(e.hpMax*.25);
    const a=e.rot+Math.PI/4;
    for(const s of [-1,1]){
      const h=new Enemy('twinHalf',e.x+Math.cos(a)*30*s,e.y+Math.sin(a)*30*s,1+this.wave*.09);
      h.hp=h.hpMax=hp; h.birth=.15;
      h.vx=Math.cos(a)*420*s; h.vy=Math.sin(a)*420*s;
      this.enemies.push(h);
    }
    this.shake=Math.max(this.shake,24); this.hitStop=.1;
    Grid.inst.impulse(e.x,e.y,420,330);
    Particles.burst(e.x,e.y,Quality.pcount(60),e.color,460,.7);
    Particles.burst(e.x,e.y,Quality.pcount(24),'#ffffff',340,.5);
    Floaters.add(e.x,e.y-e.r-20,'¡SE DIVIDE!','#4dffd2',26);
    Audio_.bigExplode();
  },

  bossDefeated(e){
    this.bossMax=0;
    this.stats.bosses=(this.stats.bosses||0)+1;
    Save.data.bossKills++;
    this.noteProgress();
    this.banner('Jefe derrotado',(this.bossInfo?this.bossInfo.name:''),e.color);
    if(this.extraLives < this.MAX_EXTRA){
      this.extraLives++; this.lives++;
      Floaters.add(this.player.x,this.player.y-64,'+1 VIDA',PAL.cyan,26);
      Audio_.power();
    }
  },

  updateOrbs(dt){
    const p=this.player, R=38;
    p.orbA=(p.orbA||0)+dt*3.6;
    const pos=[];
    for(let k=0;k<p.ship.orbs;k++){ const a=p.orbA+k/p.ship.orbs*TAU; pos.push({x:p.x+Math.cos(a)*R,y:p.y+Math.sin(a)*R}); }
    p.orbPos=pos;
    for(let i=this.eBullets.length-1;i>=0;i--){
      const b=this.eBullets[i];
      for(const o of pos) if(dist2(o.x,o.y,b.x,b.y)<(9+b.r)*(9+b.r)){
        this.eBullets.splice(i,1);
        Particles.burst(b.x,b.y,Quality.pcount(6),p.ship.color,200,.25);
        Audio_.tone('triangle',1200,900,.05,.05);
        break;
      }
    }
    for(let j=this.enemies.length-1;j>=0;j--){
      const e=this.enemies[j];
      if(e.birth>0) continue;
      if(e.orbCd>0){ e.orbCd-=dt; continue; }
      for(const o of pos) if(dist2(o.x,o.y,e.x,e.y)<(e.r+8)*(e.r+8)){
        e.orbCd=.3;
        Particles.burst(o.x,o.y,Quality.pcount(6),p.ship.color,220,.3);
        this.damageEnemy(e,j,1);
        break;
      }
    }
  },

  /* ---------------- el Vortice (agujero negro) ---------------- */
  updateVortex(dt){
    const p=this.player;
    let v=this.vortex;
    if(!v){
      if(this.wave<4 || (this.spawnQueue.length===0 && this.enemies.length===0)) return;
      this.vortexTimer-=dt;
      if(this.vortexTimer>0) return;
      // elegir un punto lejos del jugador
      const r=this.vortexRng, m=Math.min(W,H)*.18;
      let x,y,tries=0;
      do{ x=m+r()*(W-2*m); y=m+r()*(H-2*m); tries++; }
      while(dist2(x,y,p.x,p.y)<Math.pow(Math.min(W,H)*.32,2) && tries<20);
      v=this.vortex={x,y,phase:'warn',t:0,R:Math.max(240,Math.min(W,H)*.48),core:24,life:7};
      this.banner('¡Vórtice!','Un agujero negro se abre',PAL.violet);
      Audio_.vortexWarn();
      return;
    }
    v.t+=dt;
    if(v.phase==='warn'){
      Grid.inst.pull(v.x,v.y,14*v.t,v.R*.5);
      if(v.t>=2.2){
        v.phase='active'; v.t=0;
        this.shake=Math.max(this.shake,14);
        Grid.inst.pull(v.x,v.y,500,v.R);
        Audio_.droneOn();
      }
      return;
    }
    if(v.t>=v.life){ this.endVortex(); return; }
    const s=Math.min(1,v.t/.6,(v.life-v.t)/.8);   // entra y sale suave
    const R=v.R, R2=R*R;
    Grid.inst.pull(v.x,v.y,85*s,R*.85);
    // jugador: atraccion suave y escapable (su aceleracion es mucho mayor)
    {
      const dx=v.x-p.x, dy=v.y-p.y, d2=dx*dx+dy*dy;
      if(d2<R2 && d2>1){
        const d=Math.sqrt(d2), f=(1-d/R)*1050*s;
        p.ext={x:dx/d*f - dy/d*f*.25, y:dy/d*f + dx/d*f*.25};
      }
    }
    // enemigos: arrastrados; si caen al centro se desintegran (puntos dobles)
    for(let j=this.enemies.length-1;j>=0;j--){
      const e=this.enemies[j];
      const dx=v.x-e.x, dy=v.y-e.y, d2=dx*dx+dy*dy;
      if(d2>=R2) continue;
      const d=Math.sqrt(d2)||1;
      const pull=((1-d/R)*300+50)*s*(e.isBoss?.18:1);
      e.x+=(dx/d*pull - dy/d*pull*.35)*dt; e.y+=(dy/d*pull + dx/d*pull*.35)*dt;
      if(!e.isBoss && e.birth<=0 && d<v.core+e.r*.4) this.killEnemy(e,j,{vortex:true});
    }
    // balas (de ambos bandos) se curvan hacia el centro
    const bend=(list,eat)=>{
      for(let i=list.length-1;i>=0;i--){
        const b=list[i]; const dx=v.x-b.x, dy=v.y-b.y, d2=dx*dx+dy*dy;
        if(d2>=R2) continue;
        const d=Math.sqrt(d2)||1, f=(1-d/R)*1500*s*dt;
        b.vx+=dx/d*f; b.vy+=dy/d*f;
        if(eat && d<v.core) list.splice(i,1);
      }
    };
    bend(this.bullets,true); bend(this.eBullets,true);
    // particulas que caen en espiral (solo decoracion)
    if(Math.random()<.8*s){
      const a=rnd(TAU), rr=R*rnd(.9,.45);
      Particles.spawn(v.x+Math.cos(a)*rr,v.y+Math.sin(a)*rr,
        Math.cos(a+Math.PI*.62)*rr*1.3,Math.sin(a+Math.PI*.62)*rr*1.3,.7,Math.random()<.5?PAL.violet:PAL.magenta,2,.95);
    }
  },
  endVortex(){
    const v=this.vortex; if(!v) return;
    this.vortex=null;
    this.vortexTimer=16+this.vortexRng()*8;
    Audio_.droneOff();
    if(v.phase==='active'){
      Grid.inst.impulse(v.x,v.y,520,v.R*.9);
      Particles.burst(v.x,v.y,Quality.pcount(50),PAL.violet,520,.7);
      Audio_.explode(1.2);
    }
  },
  drawVortex(ctx){
    const v=this.vortex; if(!v) return;
    const T=this.time;
    ctx.save();
    if(v.phase==='warn'){
      // aviso: anillo que se cierra y parpadea
      const k=v.t/2.2;
      ctx.globalCompositeOperation='lighter';
      ctx.setLineDash([10,12]); ctx.lineDashOffset=T*60;
      ctx.strokeStyle=hexA(PAL.violet,.35+.35*Math.sin(T*16)); ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(v.x,v.y,v.R*(1-k*.75),0,TAU); ctx.stroke();
      ctx.setLineDash([]);
      ctx.strokeStyle=hexA(PAL.magenta,.6*k); ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(v.x,v.y,v.core*(.4+k),0,TAU); ctx.stroke();
      ctx.restore(); return;
    }
    const s=Math.min(1,v.t/.6,(v.life-v.t)/.8);
    // horizonte oscuro
    const g=ctx.createRadialGradient(v.x,v.y,0,v.x,v.y,v.core*3.2*s+1);
    g.addColorStop(0,'rgba(0,0,0,1)'); g.addColorStop(.42,'rgba(0,0,0,.95)'); g.addColorStop(1,'rgba(4,5,12,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(v.x,v.y,v.core*3.2*s+1,0,TAU); ctx.fill();
    // disco de acrecion
    ctx.globalCompositeOperation='lighter'; ctx.lineCap='round';
    for(let i=0;i<6;i++){
      const rr=(v.core*1.25+i*8)*s, a0=T*(4.2-i*.45)+i*1.7;
      ctx.strokeStyle=i%2?hexA(PAL.magenta,.75-i*.08):hexA(PAL.violet,.85-i*.08);
      ctx.lineWidth=3.2-i*.35; ctx.shadowColor=PAL.violet; ctx.shadowBlur=16;
      ctx.beginPath(); ctx.arc(v.x,v.y,rr,a0,a0+2.1); ctx.stroke();
      ctx.beginPath(); ctx.arc(v.x,v.y,rr,a0+Math.PI,a0+Math.PI+1.4); ctx.stroke();
    }
    // radio de influencia
    ctx.shadowBlur=0; ctx.setLineDash([4,14]); ctx.lineDashOffset=-T*40;
    ctx.strokeStyle=hexA(PAL.violet,.22*s); ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(v.x,v.y,v.R,0,TAU); ctx.stroke();
    ctx.restore();
  },

  /* ---------------- bomba de panico ---------------- */
  addBomb(v){
    if(this.bombs>=1) return;            // maximo una guardada
    this.bombCharge+=v*(1+.35*this.upN('carga'));
    if(this.bombCharge>=1){
      this.bombs=1; this.bombCharge=0;
      Floaters.add(this.player.x,this.player.y-58,'BOMBA LISTA',PAL.magenta,20);
      Audio_.bombReady();
    }
  },
  useBomb(){
    if(this.state!=='playing' || this.bombs<1) return;
    this.bombs=0; this.stats.bombs=(this.stats.bombs||0)+1;
    const p=this.player;
    // balas enemigas fuera
    for(const b of this.eBullets) if(Math.random()<.5) Particles.spawn(b.x,b.y,rnd(120,-120),rnd(120,-120),.4,b.color,2.5);
    this.eBullets.length=0;
    // enemigos normales eliminados; a los jefes solo les quita vida
    const bosses=[];
    for(let j=this.enemies.length-1;j>=0;j--){
      const e=this.enemies[j];
      if(e.isBoss){ bosses.push(e); continue; }
      this.killEnemy(e,j,{bomb:true});
    }
    for(const b of bosses){ const j=this.enemies.indexOf(b); if(j>=0) this.damageEnemy(b,j,b.hpMax*.12); }
    // efecto: onda expansiva, destello, rejilla y temblor
    const R=Math.hypot(W,H);
    this.rings.push({x:p.x,y:p.y,max:R,life:.9,max0:.9,color:PAL.magenta},{x:p.x,y:p.y,max:R*.7,life:.7,max0:.7,color:'#ffffff'});
    this.flash=1; this.shake=Math.max(this.shake,34); this.hitStop=.12;
    Grid.inst.impulse(p.x,p.y,1100,R*.9);
    Particles.burst(p.x,p.y,Quality.pcount(120),PAL.magenta,900,1.1);
    Particles.burst(p.x,p.y,Quality.pcount(60),'#ffffff',650,.8);
    p.invuln=Math.max(p.invuln,1.0);
    Audio_.bomb();
  },
  updateBombUI(){
    const k = this.bombs ? 'r' : String(Math.floor(this.bombCharge*100));
    if(k===this._bombUI) return;
    this._bombUI=k;
    const b=document.getElementById('bombBtn');
    b.classList.toggle('ready',!!this.bombs);
    b.style.setProperty('--p',this.bombs?1:this.bombCharge);
    document.getElementById('bombVal').textContent = this.bombs
      ? (this.padOn?'LB':IS_COARSE?'¡TOCA!':'ESPACIO') : k+'%';
  },

  /** puntos x combo (x2 durante la Fiebre de oro) */
  scoreMul(){ return this.mult*(this.goldT>0?2:1); },
  addScore(n,x,y,color,streak=1){
    const gained=Math.round(n*this.scoreMul());
    this.score+=gained;
    if(x!==undefined) Floaters.add(x,y,'+'+gained,this.goldT>0?'#ffd84a':(color||PAL.white),14+Math.min(14,this.mult*1.6));
    if(streak) this.bumpStreak(streak);
  },
  bumpStreak(k){
    this.killStreak+=k; this.multT=2.6;
    const nm=Math.min(12,1+Math.floor(this.killStreak/6));
    if(nm>this.mult){
      this.mult=nm;
      Floaters.add(this.player.x,this.player.y-40,'x'+this.mult,PAL.amber,26);
      Audio_.tone('square',600+this.mult*40,900+this.mult*40,.12,.1);
    }
  },

  /* ---------------- ROCE: pasar rozando sin tocar ---------------- */
  grazeR(){ return 22*(1+.35*this.upN('roce')); },
  graze(x,y){
    const p=this.player;
    this.stats.grazes=(this.stats.grazes||0)+1;
    this.score+=Math.round(25*this.scoreMul());
    this.bumpStreak(1);
    this.addBomb(.02);
    if(this.time-(this._grazeFx||0)>.18){
      this._grazeFx=this.time;
      Floaters.add(p.x+rnd(16,-16),p.y-30,'ROCE',PAL.cyan,15);
      this.rings.push({x:p.x,y:p.y,max:p.r+this.grazeR()+6,life:.22,max0:.22,color:PAL.cyan,w:3});
      Audio_.graze();
    }
    Particles.burst(x,y,Quality.pcount(4),PAL.cyan,160,.25);
  },

  killEnemy(e,i,opt){
    opt=opt||{};
    this.enemies.splice(i,1);
    const kt=e.type==='twinHalf'?'twin':e.type;
    this.stats.kills[kt]=(this.stats.kills[kt]||0)+1;
    const big=e.isBoss;
    if(opt.vortex){
      // tragado por el agujero negro: puntos dobles
      Particles.burst(e.x,e.y,Quality.pcount(16),e.color,180,.5);
      Particles.burst(e.x,e.y,Quality.pcount(8),PAL.violet,120,.4);
      Audio_.tone('sine',320,40,.3,.12);
      this.stats.vortexKills=(this.stats.vortexKills||0)+1;
      this.addScore(e.score*2,e.x,e.y,PAL.violet);
      Floaters.add(e.x,e.y-18,'x2',PAL.violet,13);
      return;
    }
    if(opt.bomb){
      // la bomba no da racha ni botin: solo puntos
      Particles.burst(e.x,e.y,Quality.pcount(12),e.color,300,.5);
      this.addScore(e.score,e.x,e.y,e.color,0);
      return;
    }
    this.shake=Math.max(this.shake,big?26:8);
    Grid.inst.impulse(e.x,e.y,big?420:130,big?340:140);
    Particles.burst(e.x,e.y,Quality.pcount(big?90:20),e.color,big?520:270,big?.95:.5);
    Particles.burst(e.x,e.y,Quality.pcount(big?40:8),'#ffffff',big?380:200,big?.6:.3);
    if(big){
      Audio_.bigExplode(); this.hitStop=.14;
      // jefe vencido cuando ya no queda ninguna parte (el Gemelo tiene dos)
      if(!this.enemies.some(o=>o.isBoss)) this.bossDefeated(e);
    } else Audio_.explode(e.r/16);
    this.addBomb(.011*this.mult);        // la bomba se carga con el combo
    // muerte a corta distancia: el combo sube el doble de rapido
    const close = dist2(e.x,e.y,this.player.x,this.player.y) < 140*140;
    if(close && !big && this.time-(this._closeFx||0)>.4){ this._closeFx=this.time; Floaters.add(e.x,e.y+18,'CERCA',PAL.amber,12); }
    if(close) this.stats.closeKills=(this.stats.closeKills||0)+1;
    this.addScore(e.score,e.x,e.y,e.color,close?2:1);
    if(e.type==='splitter'){
      for(let k=0;k<3;k++){
        const s=new Enemy('shard',e.x+grnd(26,-26),e.y+grnd(26,-26),1+this.wave*.09);
        s.birth=.18; this.enemies.push(s);
      }
    }
    const chance = big?1:(e.type==='turret'?.5:.075)*(1+.5*this.upN('botin'));
    if(grnd()<chance){
      const kinds=Object.keys(POWERS);
      this.pickups.push(new Pickup(e.x,e.y,kinds[grndi(kinds.length)]));
    }
  },

  hurtPlayer(){
    const p=this.player;
    if(p.invuln>0) return;
    // escudo regenerable de la nave
    if(p.armor){
      p.armor=false; p.armorT=0; p.invuln=1.1;
      Particles.burst(p.x,p.y,Quality.pcount(36),p.ship.color,400,.65);
      Grid.inst.impulse(p.x,p.y,240,210);
      this.shake=15; Audio_.explode(.7);
      Floaters.add(p.x,p.y-40,'ESCUDO ROTO',p.ship.color,18);
      return;
    }
    if(p.shield){
      p.shield=false; p.shieldT=0; p.invuln=1.1;
      Particles.burst(p.x,p.y,Quality.pcount(40),PAL.violet,420,.7);
      Grid.inst.impulse(p.x,p.y,260,220);
      this.shake=16; Audio_.explode(.7);
      Floaters.add(p.x,p.y-40,'ESCUDO ROTO',PAL.violet,18);
      return;
    }
    this.lives--; this.mult=1; this.killStreak=0;
    p.invuln=2.4;
    p.spread=false; p.spreadT=0; p.rapid=false; p.rapidT=0; p.shield=false; p.shieldT=0;
    this.shake=30; this.hitStop=.1;
    Particles.burst(p.x,p.y,Quality.pcount(60),p.ship.color,480,.85);
    Grid.inst.impulse(p.x,p.y,380,300);
    Audio_.hurt(); this.updateHUD();
    if(this.lives<=0) this.gameOver();
  },

  gameOver(){
    this.state='dead';
    if(this.vortex){ this.vortex=null; Audio_.droneOff(); }
    Audio_.bigExplode(); Audio_.setIntensity(0);
    // ---- guardar record por nave y dificultad ----
    const S=Save.data, key=this.recordKey(this.shipIdx,this.diffKey);
    const prev=S.records[key]||0, isNew=this.score>prev;
    if(isNew) S.records[key]=this.score;
    S.totals.runs++;
    let dailyNew=false;
    if(this.mode==='daily'){
      const d=this.dailyDate;
      dailyNew = this.score>(S.daily[d]||0);
      if(dailyNew) S.daily[d]=this.score;
      // solo se conservan los ultimos 30 dias
      const days=Object.keys(S.daily).sort();
      while(days.length>30) delete S.daily[days.shift()];
      submitDailyScore(S.name||'Anónimo',this.score);
    }
    this.noteProgress();   // tambien llama a Save.save()
    this.fillDeadScreen(isNew, Math.max(prev,this.score));
    this.fillDailyBox(dailyNew);
    setTimeout(()=>{
      if(this.state!=='dead') return;
      show('deadScreen',true);
      document.getElementById('hud').classList.remove('on');
      document.getElementById('bossBar').classList.remove('on');
    },700);
  },

  fillDailyBox(dailyNew){
    const box=document.getElementById('dailyBox');
    if(this.mode!=='daily'){ box.style.display='none'; return; }
    box.style.display='';
    const best=Save.data.daily[this.dailyDate]||0;
    document.getElementById('dailyBest').innerHTML =
      (dailyNew?'<b class="nd">¡Tu mejor del día!</b> · ':'')+'Mejor de hoy: <b>'+best.toLocaleString('es-MX')+'</b>';
    this.shareText=Daily.text(this.dailyDate,this.score,this.wave);
    document.getElementById('shareText').textContent=this.shareText;
    document.getElementById('copyBtn').textContent='Copiar resultado';
    document.getElementById('shareBtn').style.display = navigator.share ? '' : 'none';
  },
  async copyResult(){
    const ok=await copyText(this.shareText||'');
    const b=document.getElementById('copyBtn');
    b.textContent = ok ? '¡Copiado! Pégalo en WhatsApp' : 'No se pudo copiar';
    Audio_.tone('triangle',700,1000,.1,.08);
  },
  async shareResult(){
    try{ await navigator.share({text:this.shareText}); }catch(e){ /* el usuario cancelo */ }
  },
  updateDailyInfo(){
    const D=Daily.config(), best=Save.data.daily[D.date]||0;
    document.getElementById('dailyInfo').innerHTML =
      'Reto '+D.date+' · '+SHIPS[D.shipIdx].name+' · '+DIFFS[D.diff].name+
      (best ? ' · Tu mejor hoy: <b>'+best.toLocaleString('es-MX')+'</b>' : ' · Aún sin jugar');
  },

  fillDeadScreen(isNew,record){
    const st=this.stats, fmt=n=>n.toLocaleString('es-MX');
    const sh=SHIPS[this.shipIdx];
    document.getElementById('deadTag').textContent = (this.mode==='daily'?'Reto diario '+this.dailyDate+' · ':'')+sh.name+' · '+this.diff.name;
    document.getElementById('finalScore').textContent=fmt(this.score);
    document.getElementById('finalWave').textContent=this.wave;
    document.getElementById('bestScore').textContent=fmt(record);
    document.getElementById('newRec').style.display = isNew && this.score>0 ? '' : 'none';
    // enemigo que mas eliminaste
    let total=0, top=null, topN=0;
    for(const [t,n] of Object.entries(st.kills||{})){
      total+=n;
      if(n>topN){ topN=n; top=t; }
    }
    const acc = st.shots ? Math.round(st.hits/st.shots*100) : 0;
    const cells=[
      ['Precisión', acc+'%'],
      ['Eliminados', fmt(total)],
      ['Tu víctima favorita', top ? ENAMES[top]+' ×'+topN : '—'],
      ['Roces', fmt(st.grazes||0)],
      ['Jefes vencidos', fmt(st.bosses||0)],
      ['Bombas usadas', fmt(st.bombs||0)]
    ];
    document.getElementById('statGrid').innerHTML = cells.map(([l,v])=>
      `<div class="sg"><div class="label">${l}</div><div class="sv">${v}</div></div>`).join('');
    // mejoras elegidas, en el orden en que las tomaste
    const ups=document.getElementById('deadUps'); ups.innerHTML='';
    const seen={};
    for(const id of this.upOrder) seen[id]=(seen[id]||0)+1;
    for(const id of Object.keys(seen)){
      const u=UPMAP[id]; const s=document.createElement('span');
      s.className='upi'; s.style.color=u.color; s.title=u.name;
      s.textContent=u.name+(seen[id]>1?' ×'+seen[id]:'');
      ups.appendChild(s);
    }
    document.getElementById('deadUpsSect').style.display = this.upOrder.length ? '' : 'none';
    const um=document.getElementById('unlockMsg');
    um.textContent = this.unlocked.length ? 'Desbloqueaste: '+this.unlocked.join(', ') : '';
  },

  updateHUD(){
    document.getElementById('scoreVal').textContent=this.score.toLocaleString('es-MX');
    document.getElementById('waveVal').textContent=this.wave||1;
    document.getElementById('multVal').textContent='x'+this.mult;
    const lv=document.getElementById('lives');
    const total=Math.max(this.lives, this.baseLives()+this.maxLivesBonus);
    if(lv.childElementCount!==total || lv.dataset.n!==String(this.lives)){
      lv.innerHTML=''; lv.dataset.n=String(this.lives);
      for(let i=0;i<total;i++){
        const d=document.createElement('div');
        d.className='life'+(i<this.lives?'':' spent');
        d.style.background = i<this.lives ? this.player.ship.color : '';
        lv.appendChild(d);
      }
    }
    const dp=document.getElementById('dashPip');
    dp.textContent = this.player.hasDash ? (this.player.dashCd>0 ? 'Impulso '+this.player.dashCd.toFixed(1)+'s' : 'Impulso listo') : '';
  },

  update(dt){
    this.time+=dt;
    Pad.poll();
    if(Pad.active){
      if(Pad.startEdge && (this.state==='playing'||this.state==='paused')) this.togglePause();
      if(Pad.aEdge && this.state==='title') this.start('normal');
      if(Pad.yEdge && this.state==='title') this.start('daily');
      if(Pad.aEdge && this.state==='dead') this.start();
      if(Pad.bombEdge) this.useBomb();
      if(this.state==='cards'){
        if(Pad.leftEdge)  this.moveCardSel(-1);
        if(Pad.rightEdge) this.moveCardSel(1);
        if(Pad.aEdge)     this.pickCard(this.cardSel);
      }
    }
    if(this.state==='cards' && this.cardT>0) this.cardT-=dt;
    Quality.tick(dt);
    if(this.hitStop>0){ this.hitStop-=dt; dt*=.16; }
    const p=this.player;

    if(this.state==='playing'){
      p.update(dt);
      if(this.spawnQueue.length===0 && this.enemies.length===0){
        this.waveBreak-=dt;
        // oleada superada: pausa y cartas de mejora (tras un respiro corto)
        if(this.wave>0 && this.cardsFor!==this.wave && this.waveBreak<=1.2){
          this.eBullets.length=0; this.bullets.length=0;
          this.openCards();
          return;
        }
        if(this.waveBreak<=0){ this.nextWave(); this.waveBreak=2.0; }
      } else if(this.spawnQueue.length){
        this.spawnTimer-=dt;
        if(this.spawnTimer<=0){
          this.spawnOne(this.spawnQueue.shift());
          const base = this.wave % this.diff.bossEvery===0 ? .30 : Math.max(.09,.36-this.wave*.012);
          this.spawnTimer = base * this.diff.spawnMul;
        }
      }
      if(this.multT>0){ this.multT-=dt; if(this.multT<=0){ this.mult=1; this.killStreak=0; } }
      if(this.event==='apagon') this.eventT=Math.min(1,this.eventT+dt);
      if(this.goldT>0){
        this.goldT-=dt;
        if(this.goldT<=0){ this.goldT=0; Floaters.add(p.x,p.y-50,'FIN DE LA FIEBRE','#ffd84a',16); }
        this.updateEventTag();
      }

      for(const e of this.enemies) e.update(dt,p);
      this.updateVortex(dt);

      const bossDmg=1+.25*this.upN('cazajefes');
      for(let i=this.bullets.length-1;i>=0;i--){
        const b=this.bullets[i];
        b.life-=dt; b.x+=b.vx*dt; b.y+=b.vy*dt;
        // Rebote: refleja la bala en los bordes mientras le queden rebotes
        if(b.bounce>0){
          let bo=false;
          if(b.x<0){ b.x=-b.x; b.vx=-b.vx; bo=true; } else if(b.x>W){ b.x=2*W-b.x; b.vx=-b.vx; bo=true; }
          if(b.y<0){ b.y=-b.y; b.vy=-b.vy; bo=true; } else if(b.y>H){ b.y=2*H-b.y; b.vy=-b.vy; bo=true; }
          if(bo){ b.bounce--; b.last=null; b.life=Math.max(b.life,.5); Particles.burst(b.x,b.y,3,PAL.lime,160,.18); }
        }
        if(b.life<=0||b.x<-40||b.x>W+40||b.y<-40||b.y>H+40){ this.bullets.splice(i,1); continue; }
        let gone=false;
        for(let j=this.enemies.length-1;j>=0;j--){
          const e=this.enemies[j];
          if(e.birth>0 || e===b.last) continue;
          if(dist2(b.x,b.y,e.x,e.y) < (e.r+b.r)*(e.r+b.r)){
            if(!b.hitOnce){ b.hitOnce=true; this.stats.hits++; }
            Particles.burst(b.x,b.y,Quality.pcount(6),e.color,220,.24);
            Grid.inst.impulse(b.x,b.y,26,70);
            this.damageEnemy(e,j,e.isBoss?bossDmg:1);
            // Perforante: sigue de largo si le quedan perforaciones
            if(b.pierce>0){ b.pierce--; b.last=e; }
            else gone=true;
            break;
          }
        }
        if(gone) this.bullets.splice(i,1);
      }

      // Orbes del Eclipse: bloquean balas enemigas y danan al contacto
      if(p.ship.orbs) this.updateOrbs(dt);

      // Estela ardiente del impulso
      for(let i=this.trail.length-1;i>=0;i--){ const t=this.trail[i]; t.life-=dt; if(t.life<=0) this.trail.splice(i,1); }
      if(this.trail.length){
        const tdmg=this.upN('estela');
        for(let j=this.enemies.length-1;j>=0;j--){
          const e=this.enemies[j];
          if(e.birth>0) continue;
          if(e.trailCd>0){ e.trailCd-=dt; continue; }
          for(const t of this.trail){
            if(dist2(t.x,t.y,e.x,e.y) < (e.r+14)*(e.r+14)){
              e.trailCd=.3;
              Particles.burst(e.x,e.y,Quality.pcount(5),PAL.magenta,200,.25);
              this.damageEnemy(e,j,tdmg);
              break;
            }
          }
        }
      }

      const G=this.grazeR();
      for(let i=this.eBullets.length-1;i>=0;i--){
        const b=this.eBullets[i];
        b.life-=dt; b.x+=b.vx*dt; b.y+=b.vy*dt;
        if(b.life<=0||b.x<-40||b.x>W+40||b.y<-40||b.y>H+40){ this.eBullets.splice(i,1); continue; }
        const bd=dist2(b.x,b.y,p.x,p.y);
        if(bd < (p.r+b.r)*(p.r+b.r)){ this.eBullets.splice(i,1); this.hurtPlayer(); }
        else if(!b.grazed && p.invuln<=0 && bd < Math.pow(p.r+b.r+G,2)){ b.grazed=true; this.graze(b.x,b.y); }
      }

      for(const e of this.enemies){
        if(e.birth>0) continue;
        if(e.grazeCd>0) e.grazeCd-=dt;
        const ed=dist2(e.x,e.y,p.x,p.y);
        if(ed < (e.r+p.r)*(e.r+p.r)){ this.hurtPlayer(); break; }
        if(!(e.grazeCd>0) && p.invuln<=0 && ed < Math.pow(e.r+p.r+G,2)){ e.grazeCd=1.4; this.graze((e.x+p.x)/2,(e.y+p.y)/2); }
      }

      const magnetR = 150*(p.ship.magnet||1)*(1+.4*this.upN('iman'));
      const durK = 1+.3*this.upN('duracion');
      for(let i=this.pickups.length-1;i>=0;i--){
        const k=this.pickups[i]; k.update(dt);
        if(k.life<=0){ this.pickups.splice(i,1); continue; }
        const d2=dist2(k.x,k.y,p.x,p.y);
        if(d2 < magnetR*magnetR){ const d=Math.sqrt(d2)||1; k.x+=(p.x-k.x)/d*240*dt; k.y+=(p.y-k.y)/d*240*dt; }
        if(d2 < (k.r+p.r+6)*(k.r+p.r+6)){
          const info=POWERS[k.kind];
          if(k.kind==='shield'){
            p.shield=true; p.shieldT=info.dur*durK*(1+.5*this.upN('escudo'));   // ranura de defensa, independiente
          } else {
            // Dispersion y Cadencia solo se acumulan a partir de la oleada 5.
            if(this.wave < 5){ p.spread=false; p.spreadT=0; p.rapid=false; p.rapidT=0; }
            if(k.kind==='spread'){ p.spread=true; p.spreadT=info.dur*durK; }
            else { p.rapid=true; p.rapidT=info.dur*durK; }
          }
          p.powMax=p.powMax||{}; p.powMax[k.kind]=info.dur*durK*(k.kind==='shield'?1+.5*this.upN('escudo'):1);
          Floaters.add(p.x,p.y-46,info.label.toUpperCase(),info.color,20);
          Particles.burst(k.x,k.y,Quality.pcount(26),info.color,300,.55);
          Grid.inst.impulse(k.x,k.y,120,150);
          Audio_.power();
          this.pickups.splice(i,1);
        }
      }
      this.updateHUD();
      // barra de vida del jefe (suma de todas sus partes)
      let bh=0; for(const e of this.enemies) if(e.isBoss) bh+=Math.max(0,e.hp);
      const bar=document.getElementById('bossBar'), bon=bh>0 && this.bossMax>0;
      if(bar.classList.contains('on')!==bon) bar.classList.toggle('on',bon);
      if(bon) document.getElementById('bossFill').style.width=Math.min(100,bh/this.bossMax*100)+'%';
      const slot=(id,on,t,dur)=>{
        const el=document.getElementById(id);
        el.classList.toggle('on',on);
        if(on) el.querySelector('i').style.width=(t/dur*100)+'%';
      };
      const pm=p.powMax||{};
      slot('ps-spread',p.spread,p.spreadT,pm.spread||POWERS.spread.dur);
      slot('ps-rapid', p.rapid, p.rapidT, pm.rapid||POWERS.rapid.dur);
      slot('ps-shield',p.shield,p.shieldT,pm.shield||POWERS.shield.dur);
    }

    if(this.state==='playing') this.updateBombUI();
    for(let i=this.rings.length-1;i>=0;i--){ const r=this.rings[i]; r.life-=dt; if(r.life<=0) this.rings.splice(i,1); }
    if(this.flash>0) this.flash=Math.max(0,this.flash-dt*2.2);
    Grid.inst.update(dt);
    Particles.update(dt);
    Floaters.update(dt);
    if(this.shake>0) this.shake=Math.max(0,this.shake-dt*58);
    Audio_.schedule();
  },

  drawTrail(ctx){
    ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.lineCap='round';
    for(let i=1;i<this.trail.length;i++){
      const a=this.trail[i-1], b=this.trail[i];
      if(dist2(a.x,a.y,b.x,b.y)>60*60) continue;
      const t=Math.min(a.life,b.life)/.7;
      ctx.strokeStyle=hexA(PAL.magenta,.75*t); ctx.lineWidth=10*t+2;
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
    }
    ctx.restore();
  },

  draw(){
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.fillStyle='#04050c'; ctx.fillRect(0,0,W,H);
    ctx.save();
    if(this.shake>0){ const s=this.shake; ctx.translate(rnd(s,-s),rnd(s,-s)); }

    Grid.inst.draw(ctx);
    if(this.vortex) this.drawVortex(ctx);

    ctx.save(); ctx.globalCompositeOperation='lighter';
    for(const b of this.eBullets){
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,TAU);
      ctx.fillStyle=b.color; ctx.fill();
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r*.45,0,TAU);
      ctx.fillStyle='#fff'; ctx.fill();
    }
    ctx.restore();

    for(const k of this.pickups) k.draw(ctx);
    if(this.trail.length) this.drawTrail(ctx);
    for(const e of this.enemies) e.draw(ctx);

    ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.lineCap='round';
    ctx.strokeStyle='#fff7d6'; ctx.lineWidth=3.4;
    for(const b of this.bullets){
      ctx.beginPath(); ctx.moveTo(b.x,b.y);
      ctx.lineTo(b.x-b.vx*.017,b.y-b.vy*.017); ctx.stroke();
    }
    ctx.restore();

    Particles.draw(ctx);
    if(this.rings.length){
      ctx.save(); ctx.globalCompositeOperation='lighter';
      for(const r of this.rings){
        const t=1-r.life/r.max0, rad=r.max*Math.pow(t,.55);
        ctx.globalAlpha=1-t; ctx.strokeStyle=r.color; ctx.lineWidth=r.w ? 1+r.w*(1-t) : 4+26*(1-t);
        ctx.shadowColor=r.color; ctx.shadowBlur=24;
        ctx.beginPath(); ctx.arc(r.x,r.y,rad,0,TAU); ctx.stroke();
      }
      ctx.restore();
    }
    if(this.state!=='title' && this.lives>0) this.player.draw(ctx);
    Floaters.draw(ctx);
    ctx.restore();

    // ---- bloom ----
    const bw=bloomCv.width, bh=bloomCv.height;
    bctx.setTransform(1,0,0,1,0,0);
    bctx.clearRect(0,0,bw,bh);
    bctx.filter='blur(3px)';
    bctx.drawImage(cv,0,0,bw,bh);
    bctx.filter='none';
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    ctx.globalAlpha=.85;
    ctx.drawImage(bloomCv,0,0,W,H);
    if(Quality.bloomPasses()>1){
      ctx.globalAlpha=.30;
      ctx.drawImage(bloomCv,-W*.012,-H*.012,W*1.024,H*1.024);
    }
    ctx.restore();

    if(vignette) ctx.drawImage(vignette,0,0,W,H);
    if(this.event==='apagon' && (this.state==='playing'||this.state==='paused')) this.drawBlackout(ctx);
    if(this.flash>0){ ctx.save(); ctx.globalAlpha=this.flash*this.flash*.7; ctx.fillStyle='#ffe6f4'; ctx.fillRect(0,0,W,H); ctx.restore(); }
    if(this.state==='playing') Input.draw(ctx);
  }
};

function show(id,on){ document.getElementById(id).classList.toggle('hidden',!on); }

function resize(){
  DPR=Math.min(devicePixelRatio||1, Quality.dprCap());
  W=innerWidth; H=innerHeight;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  cv.style.width=W+'px'; cv.style.height=H+'px';
  bloomCv.width=Math.max(1,Math.round(W*.22));
  bloomCv.height=Math.max(1,Math.round(H*.22));
  buildVignette();
  ctx.setTransform(DPR,0,0,DPR,0,0);
}

let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);
  last=now;
  Game.update(dt);
  Game.draw();
  requestAnimationFrame(loop);
}

setInterval(()=>{
  if(Game.state==='title' && Grid.inst) Grid.inst.impulse(rnd(W),rnd(H),rnd(180,90),rnd(240,140));
},900);

addEventListener('pointerdown',()=>{ Audio_.init(); Audio_.resume(); },{once:true});
Game.init();
</script>
