<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#04050c">
<title>V&#243;rtice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --void:#04050c; --cyan:#4df0ff; --cyan-dim:#1b8fa3;
  --magenta:#ff3ea5; --lime:#a8ff3e; --amber:#ffb03d; --violet:#b06bff;
  --paper:#e8f6ff; --muted:#7e93ad;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--void);}
body{
  font-family:"Chakra Petch",system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--paper); -webkit-font-smoothing:antialiased;
  touch-action:none; user-select:none; -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
}
#stage{position:fixed;inset:0;background:var(--void);}
canvas#c{display:block;width:100%;height:100%;}

/* ---------- HUD ---------- */
#hud{
  position:fixed;inset:0;pointer-events:none;
  padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));
  display:grid;grid-template-columns:1fr auto 1fr;grid-template-rows:auto 1fr auto;gap:6px;
  opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s step-end;
}
#hud.on{opacity:1;visibility:visible;transition:opacity .45s ease,visibility 0s}
.hud-l{grid-column:1;grid-row:1;justify-self:start}
.hud-c{grid-column:2;grid-row:1;justify-self:center;text-align:center}
.hud-r{grid-column:3;grid-row:1;justify-self:end;text-align:right}
.label{font-size:clamp(8px,1.1vmin,11px);letter-spacing:.28em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.value{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;font-weight:600;
  font-size:clamp(17px,3.2vmin,36px);line-height:1;color:var(--paper);text-shadow:0 0 14px rgba(77,240,255,.45)}
#waveVal{color:var(--cyan);text-shadow:0 0 18px rgba(77,240,255,.7)}
#multVal{color:var(--amber);text-shadow:0 0 18px rgba(255,176,61,.6)}
#scoreVal.gold{color:#ffd84a;text-shadow:0 0 18px rgba(255,216,74,.85)}
#eventTag{font-size:clamp(9px,1.2vmin,12px);font-weight:700;letter-spacing:.2em;text-transform:uppercase;margin-top:3px;min-height:1em;text-shadow:0 0 10px currentColor}
#lives{display:flex;gap:5px;justify-content:flex-end;margin-top:5px;flex-wrap:wrap;max-width:150px}
.life{width:clamp(8px,1.4vmin,14px);height:clamp(10px,1.7vmin,17px);background:var(--cyan);
  clip-path:polygon(50% 0,100% 100%,50% 76%,0 100%);filter:drop-shadow(0 0 6px rgba(77,240,255,.9))}
.life.spent{background:#25405a;filter:none}
.hud-bottom{grid-column:1/-1;grid-row:3;display:flex;align-items:flex-end;justify-content:space-between;gap:14px}
#powers{flex:1;max-width:min(290px,calc(50vw - 66px));display:flex;flex-direction:column;gap:5px}
.pslot{display:none;align-items:center;gap:9px}
.pslot.on{display:flex}
.pslot .pn{font-size:clamp(8px,1.1vmin,11px);letter-spacing:.16em;text-transform:uppercase;width:78px;flex:none;text-align:right}
@media (max-width:480px){.pslot .pn{width:62px;letter-spacing:.06em}}
.pslot .pb{flex:1;height:5px;background:rgba(255,255,255,.09);border-radius:99px;overflow:hidden;display:block}
.pslot .pb i{display:block;height:100%;width:0%;border-radius:99px;transition:width .12s linear}
#ps-spread .pn{color:var(--lime)}
#ps-spread .pb i{background:var(--lime);box-shadow:0 0 10px rgba(168,255,62,.75)}
#ps-rapid .pn{color:var(--amber)}
#ps-rapid .pb i{background:var(--amber);box-shadow:0 0 10px rgba(255,176,61,.75)}
#ps-shield .pn{color:var(--violet)}
#ps-shield .pb i{background:var(--violet);box-shadow:0 0 10px rgba(176,107,255,.75)}
.hudbtn{
  pointer-events:auto;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;
  margin:9px auto 0;width:56px;height:42px;border-radius:5px;
  background:rgba(8,14,28,.72);border:1px solid rgba(77,240,255,.42);
  box-shadow:0 0 14px rgba(4,5,12,.7);
  transition:background .18s,border-color .18s;
}
.hudbtn i{display:block;width:5px;height:17px;background:var(--cyan);border-radius:1px;opacity:.85}
.hudbtn:hover{background:rgba(77,240,255,.14);border-color:rgba(77,240,255,.55)}
.hudbtn:hover i{background:var(--cyan)}
.hudbtn:focus-visible{outline:2px solid #fff;outline-offset:3px}
#hint{font-size:clamp(8px,1.2vmin,12px);letter-spacing:.14em;color:var(--muted);text-transform:uppercase;text-align:right;max-width:calc(50vw - 66px)}
#dashPip{font-size:clamp(9px,1.2vmin,12px);letter-spacing:.18em;color:var(--violet);text-transform:uppercase;margin-top:6px;min-height:1em}

/* ---------- Pantallas ---------- */
.screen{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  padding:18px;text-align:center;overflow-y:auto;
  background:radial-gradient(ellipse at center,rgba(4,5,12,.40) 0%,rgba(4,5,12,.90) 72%);
  visibility:visible;transition:opacity .35s ease,visibility .35s step-end;
}
.screen.hidden{opacity:0;pointer-events:none;visibility:hidden}
.inner{max-width:820px;width:100%;display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2.1vmin,22px);margin:auto}
h1{font-size:clamp(40px,11vmin,120px);font-weight:700;letter-spacing:.14em;line-height:.92;text-transform:uppercase;color:#fff;
  text-shadow:0 0 8px var(--cyan),0 0 28px rgba(77,240,255,.85),0 0 70px rgba(176,107,255,.55);animation:breathe 3.4s ease-in-out infinite}
@keyframes breathe{50%{text-shadow:0 0 12px var(--cyan),0 0 42px rgba(77,240,255,1),0 0 100px rgba(176,107,255,.75)}}
.tagline{font-size:clamp(9px,1.4vmin,13px);letter-spacing:.4em;text-transform:uppercase;color:var(--cyan)}
.rule{width:min(320px,70vw);height:1px;background:linear-gradient(90deg,transparent,var(--cyan-dim),transparent);flex:none}
.sect{width:100%;display:flex;flex-direction:column;align-items:center;gap:8px}
.sect > .label{margin:0}

/* selector de dificultad */
#diffRow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pick{
  pointer-events:auto;cursor:pointer;font-family:inherit;font-weight:600;
  font-size:clamp(11px,1.5vmin,14px);letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);background:rgba(255,255,255,.03);
  border:1px solid rgba(126,147,173,.32);border-radius:3px;padding:9px 18px;
  transition:color .18s,border-color .18s,background .18s,box-shadow .18s;
}
.pick:hover{color:var(--paper);border-color:rgba(77,240,255,.5)}
.pick[aria-pressed="true"]{color:var(--void);background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 20px rgba(77,240,255,.5)}
.pick:focus-visible{outline:2px solid #fff;outline-offset:3px}

/* selector de nave */
#shipRow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.ship{
  pointer-events:auto;cursor:pointer;font-family:inherit;
  width:clamp(88px,13vmin,124px);
  background:rgba(255,255,255,.025);border:1px solid rgba(126,147,173,.25);border-radius:4px;
  padding:8px 6px 9px;display:flex;flex-direction:column;align-items:center;gap:4px;
  transition:border-color .18s,background .18s,transform .18s,box-shadow .18s;
}
.ship:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.4)}
.ship[aria-pressed="true"]{background:rgba(255,255,255,.06)}
.ship:focus-visible{outline:2px solid #fff;outline-offset:3px}
.ship canvas{width:clamp(46px,7vmin,62px);height:clamp(46px,7vmin,62px);display:block}
.ship .nm{font-size:clamp(10px,1.35vmin,13px);font-weight:600;letter-spacing:.09em;line-height:1.15}
.ship .who{font-size:clamp(8px,1.05vmin,10px);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);line-height:1.2}
.ship .tr{font-size:clamp(8px,1.05vmin,10px);color:var(--muted);line-height:1.25;min-height:2.4em}

.btn{
  pointer-events:auto;cursor:pointer;font-family:"Chakra Petch",sans-serif;font-weight:700;
  font-size:clamp(12px,1.8vmin,17px);letter-spacing:.24em;text-transform:uppercase;
  color:var(--void);background:var(--cyan);border:0;border-radius:2px;
  padding:clamp(11px,1.8vmin,17px) clamp(28px,5vmin,52px);box-shadow:0 0 24px rgba(77,240,255,.55);
  transition:transform .14s cubic-bezier(.3,1.4,.5,1),box-shadow .2s,background .2s;
}
.btn:hover,.btn:focus-visible{transform:translateY(-2px) scale(1.03);box-shadow:0 0 42px rgba(77,240,255,.9);background:#7ff5ff}
.btn:focus-visible{outline:2px solid #fff;outline-offset:4px}
.keys{display:flex;flex-wrap:wrap;gap:clamp(8px,2vmin,22px);justify-content:center;font-size:clamp(9px,1.3vmin,12px);color:var(--muted);letter-spacing:.06em}
.keys b{color:var(--paper);font-weight:600}
kbd{font-family:"IBM Plex Mono",monospace;font-size:.92em;border:1px solid rgba(77,240,255,.35);border-radius:4px;padding:2px 6px;color:var(--cyan);background:rgba(77,240,255,.07)}
.stats{display:flex;gap:clamp(20px,5vmin,54px);justify-content:center}
.stat .value{font-size:clamp(22px,4.4vmin,44px)}
.dead h1{font-size:clamp(30px,7.5vmin,76px);color:var(--magenta);text-shadow:0 0 8px var(--magenta),0 0 34px rgba(255,62,165,.8)}
#pauseScreen h1{font-size:clamp(30px,7vmin,66px)}

/* ---------- bomba de panico ---------- */
#bombBtn{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);
  width:clamp(60px,9vmin,76px);height:clamp(60px,9vmin,76px);border-radius:50%;border:0;padding:0;
  pointer-events:auto;cursor:pointer;font-family:inherit;color:var(--paper);
  background:conic-gradient(var(--magenta) calc(var(--p,0)*100%),rgba(255,255,255,.1) 0);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  box-shadow:0 0 14px rgba(4,5,12,.8);transition:box-shadow .2s}
#bombBtn::before{content:'';position:absolute;inset:4px;border-radius:50%;background:rgba(6,8,18,.93)}
#bombBtn span{position:relative;line-height:1}
#bombBtn .bk{font-size:clamp(9px,1.25vmin,12px);font-weight:700;letter-spacing:.14em;color:var(--magenta)}
#bombBtn .bv{font-family:"IBM Plex Mono",monospace;font-size:clamp(8px,1.1vmin,11px);color:var(--muted)}
#bombBtn.ready{background:var(--magenta);animation:bombPulse 1s ease-in-out infinite}
#bombBtn.ready .bk{color:#fff}
#bombBtn.ready .bv{color:var(--magenta)}
#bombBtn:focus-visible{outline:2px solid #fff;outline-offset:3px}
@keyframes bombPulse{50%{box-shadow:0 0 30px rgba(255,62,165,.9),0 0 60px rgba(255,62,165,.4)}}

/* ---------- barra del jefe ---------- */
#bossBar{position:fixed;left:50%;top:calc(max(10px,env(safe-area-inset-top)) + 122px);transform:translateX(-50%);
  width:min(520px,66vw);pointer-events:none;opacity:0;transition:opacity .4s;text-align:center}
#bossBar.on{opacity:1}
#bossBar .bn{font-size:clamp(10px,1.5vmin,14px);font-weight:700;letter-spacing:.4em;text-transform:uppercase;margin-bottom:5px;
  color:var(--bc,#ff2d78);text-shadow:0 0 12px var(--bc,#ff2d78)}
#bossBar .bb{height:7px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden;border:1px solid rgba(255,255,255,.12)}
#bossBar .bb i{display:block;height:100%;width:100%;background:var(--bc,#ff2d78);box-shadow:0 0 14px var(--bc,#ff2d78);transition:width .15s linear}
@media (max-height:540px){#bossBar{top:calc(max(8px,env(safe-area-inset-top)) + 96px);width:min(420px,46vw)}}

/* ---------- anuncios (jefe, eventos, vortice) ---------- */
#banner{position:fixed;left:0;right:0;top:30%;text-align:center;pointer-events:none;opacity:0;padding:0 12px}
#banner.show{animation:bannerIn 2.8s ease forwards}
#banner .bt{font-size:clamp(26px,6.5vmin,64px);font-weight:700;letter-spacing:.18em;text-transform:uppercase;
  color:var(--bnc,#4df0ff);text-shadow:0 0 10px var(--bnc,#4df0ff),0 0 40px var(--bnc,#4df0ff)}
#banner .bs{margin-top:6px;font-size:clamp(10px,1.6vmin,15px);letter-spacing:.3em;text-transform:uppercase;color:var(--paper);opacity:.85}
@keyframes bannerIn{0%{opacity:0;transform:scale(1.25)}12%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-12px)}}

/* ---------- iconos de mejoras activas ---------- */
#upIcons{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;max-width:min(46vw,260px)}
.upi{font-family:"IBM Plex Mono",monospace;font-size:clamp(8px,1.1vmin,11px);font-weight:600;letter-spacing:.06em;
  padding:2px 5px;border:1px solid currentColor;border-radius:3px;background:rgba(4,5,12,.6);line-height:1.2;
  box-shadow:0 0 8px rgba(0,0,0,.4)}
.upi sub{font-size:.85em;vertical-align:baseline;opacity:.8;margin-left:1px}

/* ---------- cartas entre oleadas ---------- */
#cardScreen h1{font-size:clamp(24px,5.5vmin,52px)}
#cardRow{display:flex;gap:clamp(8px,1.8vmin,18px);justify-content:center;flex-wrap:wrap;width:100%}
.card{
  pointer-events:auto;cursor:pointer;font-family:inherit;color:var(--paper);text-align:left;
  width:clamp(150px,24vmin,220px);min-height:clamp(150px,26vmin,230px);
  background:linear-gradient(180deg,rgba(14,22,44,.94),rgba(8,12,26,.94));
  border:1px solid rgba(126,147,173,.35);border-radius:6px;padding:14px 13px 12px;
  display:flex;flex-direction:column;gap:8px;position:relative;
  transition:transform .16s cubic-bezier(.3,1.4,.5,1),border-color .16s,box-shadow .16s,background .16s;
  opacity:0;transform:translateY(14px);animation:cardIn .38s ease forwards;
}
.card:nth-child(2){animation-delay:.07s}.card:nth-child(3){animation-delay:.14s}
@keyframes cardIn{to{opacity:1;transform:none}}
.card:hover,.card.sel{transform:translateY(-4px) scale(1.03);border-color:var(--cc);box-shadow:0 0 26px var(--cg);background:rgba(18,28,54,.97)}
.card:focus-visible{outline:2px solid #fff;outline-offset:3px}
.card .ck{position:absolute;top:8px;right:10px;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted)}
.card .ci{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:clamp(13px,1.9vmin,17px);color:var(--cc);
  border:1px solid var(--cc);border-radius:4px;padding:3px 7px;align-self:flex-start;box-shadow:0 0 12px var(--cg)}
.card .cn{font-weight:700;font-size:clamp(13px,2vmin,18px);letter-spacing:.06em;text-transform:uppercase;color:var(--cc)}
.card .cd{font-size:clamp(11px,1.5vmin,14px);color:var(--paper);opacity:.85;line-height:1.3;flex:1}
.card .cs{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
#cardHint{font-size:clamp(9px,1.3vmin,12px);color:var(--muted);letter-spacing:.08em}

/* pantallas bajitas: movil en horizontal */
@media (max-height:540px){
  h1{font-size:clamp(30px,8.5vmin,54px)}
  .inner{gap:8px}
  .tagline{display:none}
  .ship .tr{display:none}
  .btn{padding:9px 30px}
  .card{min-height:0;padding:10px;gap:5px;width:clamp(140px,26vw,210px)}
}
/* movil en vertical: cartas en columna, compactas */
@media (max-width:560px){
  #cardRow{flex-direction:column;align-items:center}
  .card{width:min(92vw,360px);min-height:0;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto auto;column-gap:10px;row-gap:3px;padding:10px 12px}
  .card .ci{grid-row:1/4;align-self:center}
  .card .cd{flex:none}
}
@media (prefers-reduced-motion:reduce){h1{animation:none}.btn,.ship,.pick{transition:none}}

/* ---------- naves bloqueadas ---------- */
.ship.locked{filter:grayscale(1);opacity:.45;cursor:not-allowed}
.ship.locked:hover{transform:none;border-color:rgba(126,147,173,.25)}
.ship.locked .tr{color:var(--paper);opacity:.9}
.ship.deny{animation:deny .35s ease}
@keyframes deny{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.titlerec{font-size:clamp(10px,1.4vmin,13px);color:var(--muted);letter-spacing:.06em}
.titlerec b{color:var(--amber);font-family:"IBM Plex Mono",monospace}

/* ---------- pantalla de muerte ---------- */
.newrec{font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:var(--amber);font-size:clamp(12px,1.9vmin,18px);
  text-shadow:0 0 14px rgba(255,176,61,.8);animation:breathe 1.6s ease-in-out infinite}
.statgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 20px;width:min(640px,100%)}
.sg{background:rgba(255,255,255,.03);border:1px solid rgba(126,147,173,.18);border-radius:4px;padding:7px 8px}
.sg .label{margin-bottom:3px}
.sv{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:clamp(13px,2vmin,18px);color:var(--paper)}
.upline{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;max-width:640px}
.unlock{color:var(--lime);font-weight:600;letter-spacing:.1em;font-size:clamp(11px,1.6vmin,15px);min-height:0}
.unlock:empty{display:none}
.btnrow{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}
.btn.alt{background:transparent;color:var(--amber);border:1px solid var(--amber);box-shadow:0 0 18px rgba(255,176,61,.28)}
.btn.alt:hover,.btn.alt:focus-visible{background:rgba(255,176,61,.14);box-shadow:0 0 32px rgba(255,176,61,.6)}
.dailybox{border:1px solid rgba(255,176,61,.35);border-radius:6px;padding:10px 12px;width:min(520px,100%);background:rgba(255,176,61,.04)}
.dailybox .label{color:var(--amber)}
.sharetext{font-family:"IBM Plex Mono",monospace;font-size:clamp(11px,1.6vmin,14px);color:var(--paper);user-select:text;-webkit-user-select:text}
.nd{color:var(--lime)}
@media (max-width:560px){.statgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-height:540px){.statgrid{grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}.sg{padding:4px 5px}.sg .label{font-size:7px;letter-spacing:.12em}}
</style>

<div id="stage"><canvas id="c"></canvas></div>

<div id="hud">
  <div class="hud-l"><div class="label">Puntos</div><div class="value" id="scoreVal">0</div><div id="upIcons"></div></div>
  <div class="hud-c">
    <div class="label">Oleada</div><div class="value" id="waveVal">1</div>
    <button id="pauseBtn" class="hudbtn" type="button" aria-label="Pausa"><i></i><i></i></button>
    <div id="eventTag"></div>
  </div>
  <div class="hud-r">
    <div class="label">Combo</div><div class="value" id="multVal">x1</div>
    <div id="lives"></div><div id="dashPip"></div>
  </div>
  <div class="hud-bottom">
    <div id="powers">
      <div class="pslot" id="ps-spread"><span class="pn">Dispersi&#243;n</span><span class="pb"><i></i></span></div>
      <div class="pslot" id="ps-rapid"><span class="pn">Cadencia</span><span class="pb"><i></i></span></div>
      <div class="pslot" id="ps-shield"><span class="pn">Escudo</span><span class="pb"><i></i></span></div>
    </div>
    <div id="hint">P &#183; pausa &#183; M &#183; sonido</div>
  </div>
  <button id="bombBtn" type="button" aria-label="Bomba"><span class="bk">BOMBA</span><span class="bv" id="bombVal">0%</span></button>
</div>

<div id="bossBar"><div class="bn" id="bossName"></div><div class="bb"><i id="bossFill"></i></div></div>
<div id="banner"><div class="bt" id="bannerT"></div><div class="bs" id="bannerS"></div></div>

<div class="screen" id="titleScreen">
  <div class="inner">
    <div class="tagline">Sector profundo &#183; protocolo de defensa</div>
    <h1>V&#243;rtice</h1>
    <div class="rule"></div>
    <div class="sect">
      <div class="label">Dificultad</div>
      <div id="diffRow"></div>
    </div>
    <div class="sect">
      <div class="label">Elige tu nave</div>
      <div id="shipRow"></div>
    </div>
    <div class="btnrow">
      <button class="btn" id="startBtn">Iniciar</button>
      <button class="btn alt" id="dailyBtn">Reto diario</button>
    </div>
    <div class="titlerec" id="titleRec"></div>

<script>
"use strict";
/* ============================================================
   VORTICE - shooter twin-stick
   Todo procedural: sin imagenes, sin archivos de audio.
   ============================================================ */

/* ---------- utilidades ---------- */
const TAU = Math.PI * 2;
const rnd  = (a=1,b=0) => b + Math.random()*(a-b);
const rndi = (a,b) => Math.floor(rnd(a,b));
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const lerp  = (a,b,t) => a+(b-a)*t;
const dist2 = (ax,ay,bx,by) => {const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy;};
const angLerp = (a,b,t)=>{let d=((b-a+Math.PI)%TAU)-Math.PI;if(d<-Math.PI)d+=TAU;return a+d*t;};

/* ---------- azar de PARTIDA (con semilla en el reto diario) ----------
   rnd()  -> solo efectos visuales (particulas, temblor...).
   grnd() -> todo lo que cambia la partida (oleadas, cartas, eventos, IA).
   En partida normal usa Math.random; en el reto diario, mulberry32. */
function mulberry32(a){
  return function(){
    a|=0; a=a+0x6D2B79F5|0;
    let t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}
function hashStr(s){
  let h=1779033703^s.length;
  for(let i=0;i<s.length;i++){ h=Math.imul(h^s.charCodeAt(i),3432918353); h=h<<13|h>>>19; }
  h=Math.imul(h^h>>>16,2246822507); h=Math.imul(h^h>>>13,3266489909);
  return (h^h>>>16)>>>0;
}
const RNG = {
  seed:null, f:Math.random,
  /** null = azar normal; texto = semilla fija */
  set(seed){ this.seed=seed; this.f = seed===null ? Math.random : mulberry32(hashStr(seed)); },
  /** sub-generador independiente (mismas oleadas/cartas aunque cada quien juegue distinto) */
  sub(tag){ return this.seed===null ? Math.random : mulberry32(hashStr(this.seed+'|'+tag)); }
};
const grnd  = (a=1,b=0) => b + RNG.f()*(a-b);
const grndi = (a,b) => Math.floor(grnd(a,b));

const PAL = {
  cyan:'#4df0ff', magenta:'#ff3ea5', lime:'#a8ff3e',
  amber:'#ffb03d', violet:'#b06bff', white:'#ffffff',
  grid:'#22336e', gridHot:'#5fd8ff'
};

/* ============================================================
   AUDIO - sintetizado en tiempo real con Web Audio
   ============================================================ */
const Audio_ = {
  ctx:null, master:null, musicGain:null, sfxGain:null,
  muted:false, ready:false,
  step:0, nextNoteTime:0, tempo:132, intensity:0,

  init(){
    if(this.ready) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    this.ctx = new AC();
    const comp = this.ctx.createDynamicsCompressor();
    comp.threshold.value=-14; comp.knee.value=22; comp.ratio.value=9;
    comp.attack.value=.004; comp.release.value=.22;
    this.master = this.ctx.createGain();
    this.master.gain.value = this.muted ? 0 : .85;
    this.musicGain = this.ctx.createGain(); this.musicGain.gain.value = .34;
    this.sfxGain   = this.ctx.createGain(); this.sfxGain.gain.value   = .55;
    this.musicGain.connect(this.master); this.sfxGain.connect(this.master);
    this.master.connect(comp); comp.connect(this.ctx.destination);
    // ruido reutilizable
    const len = this.ctx.sampleRate*2;
    this.noiseBuf = this.ctx.createBuffer(1,len,this.ctx.sampleRate);
    const d = this.noiseBuf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    this.nextNoteTime = this.ctx.currentTime;
    this.ready = true;
  },
  resume(){ if(this.ctx && this.ctx.state==='suspended') this.ctx.resume(); },
  setMuted(m){ this.muted=m; if(this.master) this.master.gain.value = m?0:.85; },

  noise(dur, filterType, freq, gain, when){
    const c=this.ctx, t=when||c.currentTime;
    const src=c.createBufferSource(); src.buffer=this.noiseBuf;
    const f=c.createBiquadFilter(); f.type=filterType; f.frequency.value=freq;
    const g=c.createGain();
    g.gain.setValueAtTime(gain,t);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    src.connect(f); f.connect(g); g.connect(this.sfxGain);
    src.start(t); src.stop(t+dur);
    return {f,g};
  },
  tone(type,f0,f1,dur,gain,dest,when){
    const c=this.ctx, t=when||c.currentTime;
    const o=c.createOscillator(); o.type=type;
    o.frequency.setValueAtTime(f0,t);
    if(f1!==f0) o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
    const g=c.createGain();
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(gain,t+Math.min(.012,dur*.2));
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(dest||this.sfxGain);
    o.start(t); o.stop(t+dur+.02);
    return o;
  },

  /* ---- efectos ---- */
  shoot(){ if(!this.ready)return;
    this.tone('square',760,240,.075,.13);
    this.tone('sawtooth',1500,600,.045,.05);
  },
  enemyHit(){ if(!this.ready)return; this.tone('square',300,140,.05,.07); },
  explode(size){ if(!this.ready)return;
    const s = size||1;
    this.noise(.34*s,'lowpass',1600/s,.42);
    this.tone('sine',150/s,26,.42*s,.34);
    this.tone('sawtooth',420,60,.16,.09);
  },
  bigExplode(){ if(!this.ready)return;
    this.noise(.9,'lowpass',900,.55);
    this.tone('sine',110,20,1.0,.45);
    this.tone('sawtooth',260,32,.55,.16);
  },
  hurt(){ if(!this.ready)return;
    this.tone('sawtooth',420,55,.6,.32);
    this.noise(.5,'bandpass',420,.3);
  },
  power(){ if(!this.ready)return;
    const c=this.ctx,t=c.currentTime;
    [0,4,7,12].forEach((s,i)=> this.tone('triangle',440*Math.pow(2,s/12),440*Math.pow(2,s/12),.14,.14,null,t+i*.055));
  },
  cards(){ if(!this.ready)return;
    const t=this.ctx.currentTime;
    [0,5,9,14].forEach((s,i)=> this.tone('triangle',392*Math.pow(2,s/12),392*Math.pow(2,s/12),.22,.09,null,t+i*.07));
  },
  warn(){ if(!this.ready)return;
    const t=this.ctx.currentTime;
    for(let i=0;i<3;i++) this.tone('square',880,660,.12,.08,null,t+i*.16);
  },
  bomb(){ if(!this.ready)return;
    const c=this.ctx,t=c.currentTime;
    this.noise(1.6,'lowpass',2400,.7);
    this.tone('sine',90,18,1.4,.6);
    this.tone('sawtooth',60,30,1.0,.2);
    const n=this.noise(1.1,'bandpass',300,.35); n.f.frequency.exponentialRampToValueAtTime(5000,t+1.0);
    [0,7,12,16,19].forEach((s,i)=> this.tone('triangle',523*Math.pow(2,s/12),523*Math.pow(2,s/12),.5,.06,null,t+.25+i*.05));
  },
  bombReady(){ if(!this.ready)return;
    const t=this.ctx.currentTime;
    [0,12].forEach((s,i)=> this.tone('square',440*Math.pow(2,s/12),660*Math.pow(2,s/12),.18,.08,null,t+i*.1));
  },
  vortexWarn(){ if(!this.ready)return;
    this.tone('sine',420,60,2.0,.22);
    this.tone('triangle',840,110,1.8,.08);
    const n=this.noise(2.0,'bandpass',3000,.18); n.f.frequency.exponentialRampToValueAtTime(120,this.ctx.currentTime+2);
  },
  /** zumbido grave mientras el agujero negro esta abierto */
  droneOn(){ if(!this.ready||this.drone)return;
    const c=this.ctx,t=c.currentTime;
    const o1=c.createOscillator(), o2=c.createOscillator(), lfo=c.createOscillator();
    o1.type='sawtooth'; o1.frequency.value=41; o2.type='sine'; o2.frequency.value=55.5;
    lfo.frequency.value=3.2;
    const lg=c.createGain(); lg.gain.value=160;
    const lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=260; lp.Q.value=9;
    const g=c.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.22,t+.6);
    lfo.connect(lg); lg.connect(lp.frequency);
    o1.connect(lp); o2.connect(lp); lp.connect(g); g.connect(this.sfxGain);
    o1.start(t); o2.start(t); lfo.start(t);
    this.drone={o:[o1,o2,lfo],g};
    this.tone('sine',60,30,.9,.4);
  },
  droneOff(){ if(!this.drone)return;
    const t=this.ctx.currentTime, d=this.drone; this.drone=null;
    d.g.gain.cancelScheduledValues(t); d.g.gain.setValueAtTime(d.g.gain.value,t); d.g.gain.linearRampToValueAtTime(0,t+.5);
    for(const o of d.o) o.stop(t+.6);
  },
  graze(){ if(!this.ready)return;
    this.tone('triangle',1800,2600,.06,.07);
    this.noise(.04,'highpass',6000,.08);
  },
  gold(){ if(!this.ready)return;
    const t=this.ctx.currentTime;
    [0,4,7,12,16,19,24].forEach((s,i)=> this.tone('square',523*Math.pow(2,s/12),523*Math.pow(2,s/12),.16,.07,null,t+i*.06));
  },
  waveUp(){ if(!this.ready)return;
    const c=this.ctx,t=c.currentTime;
    [0,7,12,19].forEach((s,i)=> this.tone('square',330*Math.pow(2,s/12),330*Math.pow(2,s/12),.3,.1,null,t+i*.09));
  },

  /* ---- musica procedural ---- */
  SCALE:[0,3,5,7,10],           // pentatonica menor
  ROOT: 55,                      // La1
  schedule(){
    if(!this.ready || this.muted) return;
    const c=this.ctx;
    const spb = 60/this.tempo/4;           // duracion de semicorchea
    while(this.nextNoteTime < c.currentTime + .12){
      const t=this.nextNoteTime, s=this.step%64, I=this.intensity;

      // bombo
      if(s%8===0 || (I>.35 && s%16===11)){
        this.tone('sine',110,34,.24,.62,this.musicGain,t);
        this.noise(.05,'lowpass',3000,.2,t);
      }
      // caja
      if(s%16===8 || (I>.6 && s%32===28)){
        this.noise(.16,'highpass',1400,.24,t);
        this.tone('triangle',210,110,.1,.12,this.musicGain,t);
      }
      // charles
      if(s%2===0 && I>.12) this.noise(.035,'highpass',7200,.055+I*.05,t);
      // bajo
      if(s%4===0){
        const deg=this.SCALE[(Math.floor(s/8)+ (s%16===12?2:0))%5];
        const f=this.ROOT*Math.pow(2,deg/12);
        const o=this.tone('sawtooth',f,f,spb*3.4,.2,null,t);
        const lp=c.createBiquadFilter(); lp.type='lowpass';
        lp.frequency.setValueAtTime(220+I*900,t);
        lp.frequency.exponentialRampToValueAtTime(160,t+spb*3.4);
        lp.Q.value=7;
        o.disconnect(); const g=c.createGain(); g.gain.value=.5;
        o.connect(lp); lp.connect(g); g.connect(this.musicGain);
      }
      // arpegio (entra con intensidad)
      if(I>.25 && s%2===1){
        const deg=this.SCALE[(this.step*3)%5];
        const oct=1+((this.step>>3)%2);
        const f=this.ROOT*4*Math.pow(2,deg/12+oct-1);
        this.tone('square',f,f,spb*1.5,.055*Math.min(1,I*1.4),this.musicGain,t);
      }
      // pad de tension en oleadas altas
      if(I>.7 && s===0){
        this.tone('sawtooth',this.ROOT*2,this.ROOT*2,spb*60,.03,this.musicGain,t);
      }
      this.nextNoteTime += spb;
      this.step++;
    }
  },
  setIntensity(v){ this.intensity = clamp(v,0,1); this.tempo = 126 + v*26; }
};

/* ============================================================
   ENTRADA - teclado + raton + DOS palancas virtuales en tactil
   ============================================================ */
const IS_COARSE = matchMedia('(pointer:coarse)').matches;

/* ------------------------------------------------------------
   MANDO (Gamepad API)
   Funciona con mandos Bluetooth en Chrome de Android, pero SOLO
   sobre HTTPS: con el archivo abierto desde el disco no aparece.
   Mapeo estandar: ejes 0/1 stick izquierdo, 2/3 stick derecho.
   Botones: 0=A 1=B 4=LB 5=RB 6=LT 7=RT 9=Start
   ------------------------------------------------------------ */
const Pad = {
  gp:null, active:false,
  DEADL:.22, DEADR:.28,
  fireHeld:false, dashEdge:false, startEdge:false, aEdge:false,
  _dash:false, _start:false, _a:false,

  poll(){
    let g=null;
    if(navigator.getGamepads){
      const list=navigator.getGamepads();
      for(let i=0;i<list.length;i++){
        const c=list[i];
        if(c && c.connected){ g=c; break; }
      }
    }
    this.gp=g;
    const before=this.active;
    if(g){
      if(!this.active){
        // no se considera activo hasta que el jugador toca algo
        let touched=false;
        for(const a of g.axes) if(Math.abs(a)>.4) touched=true;
        for(const b of g.buttons) if(b && b.pressed) touched=true;
        if(touched) this.active=true;
      }
    } else this.active=false;

    const b=i=>!!(g && g.buttons[i] && g.buttons[i].pressed);
    const dash = b(1)||b(6);
    const bomb = b(4);
    this.bombEdge = bomb && !this._bomb; this._bomb=bomb;
    const y=b(3); this.yEdge = y && !this._y; this._y=y;
    const start= b(9);
    const a    = b(0);
    this.dashEdge  = dash  && !this._dash;
    this.startEdge = start && !this._start;
    this.aEdge     = a     && !this._a;
    this._dash=dash; this._start=start; this._a=a;
    // izquierda / derecha (cruceta o stick) para elegir cartas
    const ax=g ? (g.axes[0]||0) : 0;
    const left = b(14) || ax<-.6, right = b(15) || ax>.6;
    this.leftEdge  = left  && !this._left;
    this.rightEdge = right && !this._right;
    this._left=left; this._right=right;
    this.fireHeld = b(0)||b(7)||b(5);

    if(this.active!==before && typeof Game!=='undefined' && Game.onPadChange) Game.onPadChange(this.active);
  },

  stick(ax,ay,dead){
    if(!this.gp) return null;
    const x=this.gp.axes[ax]||0, y=this.gp.axes[ay]||0;
    const m=Math.hypot(x,y);
    if(m<dead) return null;
    const k=Math.min(1,(m-dead)/(1-dead));
    return {x:x/m*k, y:y/m*k, nx:x/m, ny:y/m};
  }
};

const Input = {
  keys:{}, mx:0, my:0, mouseFiring:false, aimActive:false, touch:false,
  // palanca izquierda (mover) y derecha (apuntar/disparar)
  L:{id:null, ox:0, oy:0, x:0, y:0, on:false},
  R:{id:null, ox:0, oy:0, x:0, y:0, on:false},
  lastAim:{x:1,y:0},
  dashRequested:false, lastLeftTap:0,
  DEAD:10, MAXR:58,

  init(canvas){
    addEventListener('keydown',e=>{
      if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
      if(e.code==='Space' && !e.repeat) Game.useBomb();
      if(!this.keys[e.code] && (e.code==='ShiftLeft'||e.code==='ShiftRight')) this.dashRequested=true;
      this.keys[e.code]=true;
      if(e.code==='KeyP'||e.code==='Escape') Game.togglePause();
      if(e.code==='KeyM') Game.toggleMute();
      if(Game.state==='cards'){
        const n={Digit1:0,Digit2:1,Digit3:2,Numpad1:0,Numpad2:1,Numpad3:2}[e.code];
        if(n!==undefined) Game.pickCard(n);
        if(e.code==='ArrowLeft'||e.code==='KeyA') Game.moveCardSel(-1);
        if(e.code==='ArrowRight'||e.code==='KeyD') Game.moveCardSel(1);
        if(e.code==='Enter') Game.pickCard(Game.cardSel);
      }
    });
    addEventListener('keyup',e=>{ this.keys[e.code]=false; });
    addEventListener('blur',()=>{ this.keys={}; this.mouseFiring=false; });

    canvas.addEventListener('mousemove',e=>{ this.mx=e.clientX; this.my=e.clientY; this.aimActive=true; });
    canvas.addEventListener('mousedown',e=>{ if(e.button===0) this.mouseFiring=true; });
    addEventListener('mouseup',()=>{ this.mouseFiring=false; });
    canvas.addEventListener('contextmenu',e=>e.preventDefault());

    const half=()=>innerWidth*.5;
    canvas.addEventListener('touchstart',e=>{
      this.touch=true;
      for(const t of e.changedTouches){
        const left = t.clientX < half();
        const s = left ? this.L : this.R;
        if(s.id===null){
          s.id=t.identifier; s.ox=s.x=t.clientX; s.oy=s.y=t.clientY; s.on=true;
          if(left){
            const now=performance.now();
            if(now-this.lastLeftTap < 300) this.dashRequested=true;
            this.lastLeftTap=now;
          }
        }
      }
      e.preventDefault();
    },{passive:false});

    const moveH=e=>{
      for(const t of e.changedTouches){
        if(t.identifier===this.L.id){ this.L.x=t.clientX; this.L.y=t.clientY; }
        else if(t.identifier===this.R.id){ this.R.x=t.clientX; this.R.y=t.clientY; }
      }
      e.preventDefault();
    };
    canvas.addEventListener('touchmove',moveH,{passive:false});

    const endH=e=>{
      for(const t of e.changedTouches){
        if(t.identifier===this.L.id){ this.L.id=null; this.L.on=false; }
        else if(t.identifier===this.R.id){ this.R.id=null; this.R.on=false; }
      }
      e.preventDefault();
    };
    canvas.addEventListener('touchend',endH,{passive:false});
    canvas.addEventListener('touchcancel',endH,{passive:false});
  },

  /** vector de una palanca, normalizado, con zona muerta */
  stickVec(s){
    if(!s.on) return null;
    const dx=s.x-s.ox, dy=s.y-s.oy;
    const m=Math.hypot(dx,dy);
    if(m < this.DEAD) return null;
    const k=Math.min(1, m/this.MAXR);
    return {x:dx/m*k, y:dy/m*k, nx:dx/m, ny:dy/m};
  },

  move(){
    if(Pad.active){
      const v=Pad.stick(0,1,Pad.DEADL);
      if(v) return v;
      if(!this.L.on) return {x:0,y:0};
    }
    const v=this.stickVec(this.L);
    if(v) return v;
    if(this.L.on) return {x:0,y:0};
    let x=0,y=0;
    if(this.keys.KeyA||this.keys.ArrowLeft) x-=1;
    if(this.keys.KeyD||this.keys.ArrowRight) x+=1;
    if(this.keys.KeyW||this.keys.ArrowUp) y-=1;
    if(this.keys.KeyS||this.keys.ArrowDown) y+=1;
    const m=Math.hypot(x,y);
    return m ? {x:x/m,y:y/m} : {x:0,y:0};
  },

  /**
   * Direccion de disparo.
   * En tactil es RELATIVA: hacia donde arrastras el pulgar desde donde lo apoyaste.
   * Si el pulgar esta quieto, se conserva la ultima direccion para poder seguir disparando.
   */
  aimDir(px,py){
    if(Pad.active){
      const v=Pad.stick(2,3,Pad.DEADR);
      if(v){ this.lastAim.x=v.nx; this.lastAim.y=v.ny; return this.lastAim; }
      if(!this.R.on && !this.aimActive) return this.lastAim;
    }
    if(this.R.on){
      const v=this.stickVec(this.R);
      if(v){ this.lastAim.x=v.nx; this.lastAim.y=v.ny; }
      return this.lastAim;
    }
    if(this.aimActive){
      const dx=this.mx-px, dy=this.my-py, m=Math.hypot(dx,dy);
      if(m>1){ this.lastAim.x=dx/m; this.lastAim.y=dy/m; }
      return this.lastAim;
    }
    return null;
  },

  shooting(){
    if(Pad.active && (Pad.fireHeld || Pad.stick(2,3,Pad.DEADR))) return true;
    return this.mouseFiring || this.R.on;
  },

  takeDash(){ const d=this.dashRequested||Pad.dashEdge; this.dashRequested=false; return d; },

  /** dibuja las dos palancas para que se vean bajo el pulgar */
  draw(ctx){
    if(!this.touch || Pad.active) return;
    for(const [s,col] of [[this.L,'rgba(120,200,255,'],[this.R,'rgba(255,176,61,']]){
      if(!s.on) continue;
      ctx.save();
      ctx.lineWidth=2;
      ctx.strokeStyle=col+'.18)';
      ctx.beginPath(); ctx.arc(s.ox,s.oy,this.MAXR,0,TAU); ctx.stroke();
      const dx=s.x-s.ox, dy=s.y-s.oy, m=Math.hypot(dx,dy)||1;
      const k=Math.min(1,m/this.MAXR);
      const kx=s.ox+dx/m*this.MAXR*k, ky=s.oy+dy/m*this.MAXR*k;
      ctx.beginPath(); ctx.arc(kx,ky,17,0,TAU);
      ctx.fillStyle=col+'.13)'; ctx.fill();
      ctx.strokeStyle=col+'.48)'; ctx.stroke();
      ctx.restore();
    }
  }
};
/* ============================================================
   REJILLA DEFORMABLE - el fondo que se ondula con las explosiones
   ============================================================ */
class Grid{
  constructor(){ this.build(); }
  build(){
    this.sp = innerWidth<720 ? 48 : 66;
    this.cols = Math.ceil(W/this.sp)+2;
    this.rows = Math.ceil(H/this.sp)+2;
    this.pts = [];
    for(let j=0;j<this.rows;j++)
      for(let i=0;i<this.cols;i++)
        this.pts.push({ox:i*this.sp-this.sp, oy:j*this.sp-this.sp,
                       x:i*this.sp-this.sp, y:j*this.sp-this.sp, vx:0, vy:0});
  }
  at(i,j){ return this.pts[j*this.cols+i]; }
  impulse(px,py,force,radius){
    const r2=radius*radius;
    for(const p of this.pts){
      const dx=p.x-px, dy=p.y-py, d2=dx*dx+dy*dy;
      if(d2<r2 && d2>1){
        const d=Math.sqrt(d2), f=force*(1-d/radius)/d;
        p.vx+=dx*f; p.vy+=dy*f;
      }
    }
  }
  pull(px,py,force,radius){ this.impulse(px,py,-force,radius); }
  update(dt){
    const k=58, damp=Math.pow(.0016,dt);
    for(const p of this.pts){
      p.vx += (p.ox-p.x)*k*dt;
      p.vy += (p.oy-p.y)*k*dt;
      p.vx*=damp; p.vy*=damp;
      p.x+=p.vx*dt; p.y+=p.vy*dt;
    }
  }
  draw(ctx){
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    ctx.lineWidth=1;
    const hot=[];
    // Los segmentos en reposo van todos en un unico path: ~2000 strokes -> 1.
    ctx.beginPath();
    ctx.strokeStyle='rgba(36,56,124,.48)';
    const push=(a,b)=>{
      const da=Math.abs(a.x-a.ox)+Math.abs(a.y-a.oy)+Math.abs(b.x-b.ox)+Math.abs(b.y-b.oy);
      const heat=da/58;
      if(heat<.03){ ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); }
      else hot.push(a,b,Math.min(1,heat));
    };
    for(let j=0;j<this.rows;j++)
      for(let i=0;i<this.cols-1;i++) push(this.at(i,j),this.at(i+1,j));
    for(let i=0;i<this.cols;i++)
      for(let j=0;j<this.rows-1;j++) push(this.at(i,j),this.at(i,j+1));
    ctx.stroke();
    // Solo los deformados se dibujan uno a uno, con su brillo propio.
    for(let k=0;k<hot.length;k+=3){
      const a=hot[k], b=hot[k+1], heat=hot[k+2];
      const r=Math.round(36+heat*162), g=Math.round(56+heat*182), bl=Math.round(124+heat*131);
      ctx.strokeStyle=`rgba(${r},${g},${bl},${.48+heat*.52})`;
      ctx.lineWidth=1+heat*1.4;
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
    }
    ctx.restore();
  }
}

/* ============================================================
   PARTICULAS - trazos, no puntos
   ============================================================ */
const Particles = {
  list:[],
  spawn(x,y,vx,vy,life,color,width,drag){
    if(this.list.length>1500) this.list.shift();
    this.list.push({x,y,vx,vy,life,max:life,color,w:width||2,drag:drag||.86});
  },
  burst(x,y,n,color,speed,life,spread){
    const base=rnd(TAU);
    for(let i=0;i<n;i++){
      const a = spread!==undefined ? base+rnd(spread,-spread) : rnd(TAU);
      const s = speed*rnd(1.25,.35);
      this.spawn(x,y,Math.cos(a)*s,Math.sin(a)*s,life*rnd(1.35,.55),color,rnd(2.8,1.1));
    }
  },
  update(dt){
    for(let i=this.list.length-1;i>=0;i--){
      const p=this.list[i];
      p.life-=dt;
      if(p.life<=0){ this.list.splice(i,1); continue; }
      const d=Math.pow(p.drag,dt*60);
      p.vx*=d; p.vy*=d;
      p.x+=p.vx*dt; p.y+=p.vy*dt;
    }
  },
  draw(ctx){
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    ctx.lineCap='round';
    for(const p of this.list){
      const t=p.life/p.max;
      ctx.globalAlpha=t*t;
      ctx.strokeStyle=p.color;
      ctx.lineWidth=p.w*t;
      ctx.beginPath();
      ctx.moveTo(p.x,p.y);
      ctx.lineTo(p.x-p.vx*.022,p.y-p.vy*.022);
      ctx.stroke();
    }
    ctx.restore();
  },
  clear(){ this.list.length=0; }
};

/* ============================================================
   TEXTOS FLOTANTES
   ============================================================ */
const Floaters = {
  list:[],
  add(x,y,text,color,size){ this.list.push({x,y,text,color,size:size||16,life:.9,max:.9}); },
  update(dt){
    for(let i=this.list.length-1;i>=0;i--){
      const f=this.list[i]; f.life-=dt; f.y-=34*dt;
      if(f.life<=0) this.list.splice(i,1);
    }
  },
  draw(ctx){
    ctx.save();
    ctx.textAlign='center'; ctx.textBaseline='middle';
    for(const f of this.list){
      const t=f.life/f.max;
      ctx.globalAlpha=t;
      ctx.fillStyle=f.color;
      ctx.font=`600 ${f.size}px "IBM Plex Mono",monospace`;
      ctx.fillText(f.text,f.x,f.y);
    }
    ctx.restore();
  },
  clear(){ this.list.length=0; }
};

/* ============================================================
   ENTIDADES
   ============================================================ */
function drawPoly(ctx,x,y,r,sides,rot,color,fill,lw){
  ctx.save();
  ctx.translate(x,y); ctx.rotate(rot);
  ctx.beginPath();
  for(let i=0;i<sides;i++){
    const a=i/sides*TAU;
    const px=Math.cos(a)*r, py=Math.sin(a)*r;
    i?ctx.lineTo(px,py):ctx.moveTo(px,py);
  }
  ctx.closePath();
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  ctx.strokeStyle=color; ctx.lineWidth=lw||2;
  ctx.shadowColor=color; ctx.shadowBlur=10;
  ctx.stroke();
  ctx.restore();
}

function hullPath(ctx, ship, s){
  const pts=HULLS[ship.id];
  ctx.beginPath();
  for(let i=0;i<pts.length;i++){
    const x=pts[i][0]*s, y=pts[i][1]*s;
    i?ctx.lineTo(x,y):ctx.moveTo(x,y);
  }
  ctx.closePath();
}

/** Dibuja una nave centrada en el origen, mirando a +X. */
function drawShip(ctx, ship, thrust, glow){
  const s=ship.scale;
  if(thrust>.05){
    const f=thrust*(0.75+Math.random()*.5);
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    const bx=-11*s;
    ctx.beginPath();
    ctx.moveTo(bx,-5*s); ctx.lineTo(bx-26*s*f,0); ctx.lineTo(bx,5*s);
    ctx.closePath();
    const g=ctx.createLinearGradient(bx,0,bx-26*s*f,0);
    g.addColorStop(0,'rgba(255,255,255,.95)');
    g.addColorStop(.4,hexA(ship.accent,.75));
    g.addColorStop(1,hexA(ship.color,0));
    ctx.fillStyle=g; ctx.fill();
    ctx.restore();
  }
  hullPath(ctx,ship,s);
  ctx.fillStyle = ship.hull || 'rgba(8,22,40,.88)';
  ctx.fill();
  ctx.strokeStyle=ship.color; ctx.lineWidth=2.2;
  if(glow){ ctx.shadowColor=ship.color; ctx.shadowBlur=14; }
  ctx.stroke();
  ctx.shadowBlur=0;
  // cabina
  ctx.beginPath(); ctx.arc(2*s,0,3.1*s,0,TAU);
  ctx.fillStyle=ship.accent; ctx.fill();
  // los tres canones del Abanico
  if(ship.id==='abanico'){
    ctx.strokeStyle=ship.accent; ctx.lineWidth=1.6;
    for(const oy of [-9,0,9]){
      ctx.beginPath(); ctx.moveTo(4*s,oy*s); ctx.lineTo(12*s,oy*s*.55); ctx.stroke();
    }
  }
  // anillo del Eclipse
  if(ship.id==='eclipse'){
    ctx.strokeStyle=ship.accent; ctx.lineWidth=1.3; ctx.setLineDash([3,3]);
    ctx.beginPath(); ctx.arc(2*s,0,7*s,0,TAU); ctx.stroke(); ctx.setLineDash([]);
  }
  // motores gemelos de La Fugaz
  if(ship.id==='fugaz'){
    ctx.fillStyle=ship.accent;
    ctx.fillRect(-12*s,-8*s,3*s,3*s);
    ctx.fillRect(-12*s,5*s,3*s,3*s);
  }
}

function hexA(hex,a){
  const n=parseInt(hex.slice(1),16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}

/* ============================================================
   JUGADOR
   ============================================================ */
class Player{
  constructor(){ this.ship=SHIPS[4]; this.reset(); }
  setShip(s){ this.ship=s; }
  reset(){
    this.x=W/2; this.y=H/2; this.vx=0; this.vy=0;
    this.r=this.ship.r; this.angle=-Math.PI/2;
    this.cool=0; this.invuln=2.2; this.thrust=0;
    // Tres ranuras independientes: dos de arma y una de defensa.
    this.spread=false; this.spreadT=0;
    this.rapid=false;  this.rapidT=0;
    this.shield=false; this.shieldT=0;
    this.armor=false;  this.armorT=0;   // escudo propio de El Guardian
    this.dashCd=0; this.dashT=0;
  }
  /** velocidad y aceleracion con la mejora Motor */
  get speed(){ return this.ship.speed*(1+.10*Game.upN('motor')); }
  get hasDash(){ return !!this.ship.dash || Game.upN('impulso')>0; }
  get dashCool(){
    const n=Game.upN('impulso') - (this.ship.dash?0:1);
    return 3*Math.pow(.7,Math.max(0,n));
  }
  update(dt){
    const sh=this.ship;
    const m=Input.move();
    const acc=sh.accel*(1+.10*Game.upN('motor'));
    this.vx+=m.x*acc*dt; this.vy+=m.y*acc*dt;
    if(this.ext){ this.vx+=this.ext.x*dt; this.vy+=this.ext.y*dt; this.ext=null; }
    const damp=Math.pow(this.dashT>0?.35:.0009,dt);
    this.vx*=damp; this.vy*=damp;
    const maxv = this.dashT>0 ? 1600 : this.speed;
    const sp=Math.hypot(this.vx,this.vy);
    if(sp>maxv){ this.vx=this.vx/sp*maxv; this.vy=this.vy/sp*maxv; }
    this.x=clamp(this.x+this.vx*dt,this.r,W-this.r);
    this.y=clamp(this.y+this.vy*dt,this.r,H-this.r);
    if(this.x<=this.r||this.x>=W-this.r) this.vx*=-.4;
    if(this.y<=this.r||this.y>=H-this.r) this.vy*=-.4;
    this.thrust=lerp(this.thrust,Math.min(1,sp/this.speed),1-Math.pow(.001,dt));

    // ---- apuntado ----
    let dir=null;
    if(sh.autoAim){
      let best=null,bd=1e9;
      for(const e of Game.enemies){
        if(e.birth>0) continue;
        const d=dist2(e.x,e.y,this.x,this.y);
        if(d<bd){ bd=d; best=e; }
      }
      if(best){ const dx=best.x-this.x, dy=best.y-this.y, mm=Math.hypot(dx,dy)||1; dir={x:dx/mm,y:dy/mm}; }
    }
    if(!dir) dir=Input.aimDir(this.x,this.y);
    if(!dir){
      const mm=Math.hypot(this.vx,this.vy);
      if(mm>10) dir={x:this.vx/mm,y:this.vy/mm};
    }
    if(dir){
      const want=Math.atan2(dir.y,dir.x);
      const snap = sh.autoAim ? .000002 : .00005;
      this.angle=angLerp(this.angle,want,1-Math.pow(snap,dt));
    }

    // ---- impulso (La Fugaz, o cualquier nave con la mejora) ----
    if(this.dashCd>0) this.dashCd-=dt;
    if(this.dashT>0){
      this.dashT-=dt;
      // Estela ardiente: deja puntos que danan a los enemigos que los tocan
      if(Game.upN('estela')){
        this.trailAcc=(this.trailAcc||0)+dt;
        if(this.trailAcc>.012){ this.trailAcc=0; Game.trail.push({x:this.x,y:this.y,life:.7}); }
      }
    }
    const wantsDash=Input.takeDash();
    if(this.hasDash && wantsDash && this.dashCd<=0){
      let dx=m.x, dy=m.y;
      if(!dx && !dy){ dx=Math.cos(this.angle); dy=Math.sin(this.angle); }
      const mm=Math.hypot(dx,dy)||1;
      this.vx=dx/mm*1500; this.vy=dy/mm*1500;
      this.dashT=.22; this.dashCd=this.dashCool; this.invuln=Math.max(this.invuln,.3);
      Particles.burst(this.x,this.y,26,sh.color,420,.45);
      Grid.inst.impulse(this.x,this.y,150,150);
      Audio_.tone('sawtooth',900,180,.22,.16);
    }

    // ---- escudo regenerable (El Guardian) ----
    if(sh.shieldRegen && !this.armor){
      this.armorT+=dt*(1+.5*Game.upN('escudo'));
      if(this.armorT>=sh.shieldRegen){
        this.armor=true; this.armorT=0;
        Floaters.add(this.x,this.y-46,'ESCUDO LISTO',sh.color,18);
        Audio_.power();
      }
    }

    // estela
    if(sp>60 && Math.random()<.9){
      const back=this.angle+Math.PI;
      const boost=this.dashT>0?2.4:1;
      Particles.spawn(this.x+Math.cos(back)*12,this.y+Math.sin(back)*12,
        Math.cos(back)*rnd(150,60)*boost-this.vx*.1, Math.sin(back)*rnd(150,60)*boost-this.vy*.1,
        .32, sh.accent, 2.4, .9);
    }
    Grid.inst.pull(this.x,this.y,26,110);

    this.cool-=dt;
    if(this.invuln>0) this.invuln-=dt;
    if(this.spreadT>0){ this.spreadT-=dt; if(this.spreadT<=0) this.spread=false; }
    if(this.rapidT>0){  this.rapidT-=dt;  if(this.rapidT<=0)  this.rapid=false; }
    if(this.shieldT>0){ this.shieldT-=dt; if(this.shieldT<=0) this.shield=false; }
    if(Input.shooting() && this.cool<=0) this.fire();
  }
  fire(){
    const sh=this.ship;
    // Dispersion cambia el PATRON. Cadencia cambia solo la VELOCIDAD.
    // Antes, cadencia reducia el disparo a una sola bala y empeoraba a las
    // naves de disparo doble; ahora cada poder toca una cosa distinta.
    let offs = this.spread ? [-.28,-.095,.095,.28] : PATTERNS[sh.pattern];
    const lat=Game.upN('lateral');
    if(lat>=1) offs=offs.concat([-.62,.62]);
    if(lat>=2) offs=offs.concat([-1.45,1.45]);
    let rate = (this.rapid ? sh.fireRate*.55 : sh.fireRate) / (1+.15*Game.upN('cadencia'));
    this.cool=rate;
    const fast=Game.upN('veloces');
    const spd=880*(1+.2*fast), life=1.15*(1+.15*fast);
    const bounce=Game.upN('rebote'), pierce=Game.upN('perfora');
    for(const off of offs){
      const a=this.angle+off, nx=Math.cos(a), ny=Math.sin(a);
      Game.bullets.push({x:this.x+nx*18, y:this.y+ny*18,
        vx:nx*spd+this.vx*.3, vy:ny*spd+this.vy*.3, life, r:4,
        bounce, pierce, last:null, hitOnce:false});
      Game.stats.shots++;
    }
    Particles.burst(this.x+Math.cos(this.angle)*20,this.y+Math.sin(this.angle)*20,
      Quality.pcount(4),'#ffffff',260,.16,.4);
    this.vx-=Math.cos(this.angle)*26; this.vy-=Math.sin(this.angle)*26;
    Audio_.shoot();
  }
  draw(ctx){
    if(this.invuln>0 && this.dashT<=0 && Math.floor(this.invuln*14)%2===0) return;
    ctx.save();
    ctx.translate(this.x,this.y); ctx.rotate(this.angle);
    drawShip(ctx,this.ship,this.thrust,true);
    ctx.restore();

    // orbes del Eclipse
    if(this.ship.orbs && this.orbPos){
      ctx.save(); ctx.globalCompositeOperation='lighter';
      for(const o of this.orbPos){
        ctx.beginPath(); ctx.arc(o.x,o.y,6.5,0,TAU);
        ctx.fillStyle=this.ship.accent; ctx.shadowColor=this.ship.color; ctx.shadowBlur=16; ctx.fill();
        ctx.beginPath(); ctx.arc(o.x,o.y,10,0,TAU);
        ctx.strokeStyle=hexA(this.ship.color,.6); ctx.lineWidth=1.5; ctx.stroke();
      }
      ctx.restore();
    }
    if(this.armor || this.shield){
      const col = this.shield ? PAL.violet : this.ship.color;
      ctx.save();
      ctx.globalCompositeOperation='lighter';
      ctx.beginPath(); ctx.arc(this.x,this.y,this.r+13+Math.sin(Game.time*7)*2,0,TAU);
      ctx.strokeStyle=hexA(col,.85); ctx.lineWidth=2.4;
      ctx.shadowColor=col; ctx.shadowBlur=18; ctx.stroke();
      ctx.restore();
    }
  }
}

  twin:    {r:46, hp:46,speed:120, color:'#4dffd2',   sides:4, score:3000,rotSpd:.8, boss:true},
  twinHalf:{r:30, hp:12,speed:215, color:'#4dffd2',   sides:4, score:1500,rotSpd:2.6,boss:true},
  ram:     {r:44, hp:52,speed:70,  color:'#ff7a2d',   sides:3, score:3500,rotSpd:0,  boss:true}
};
/* Los tres jefes rotan en este orden */
const BOSSES = [
  {type:'boss', name:'Hexarca',   sub:'Disparo en abanico'},
  {type:'twin', name:'Gemelo',    sub:'Se divide a la mitad de su vida'},
  {type:'ram',  name:'Embestida', sub:'Esquiva la línea roja'}
];

class Enemy{
  constructor(type,x,y,waveScale){
    const d=ETYPES[type];
    this.type=type; this.x=x; this.y=y; this.isBoss=!!d.boss;
    this.r=d.r; this.hpMax=this.hp=Math.ceil(d.hp*(d.boss?waveScale:1));
    this.speed=d.speed*(1+ (waveScale-1)*.10)*(Game.diff?Game.diff.speedMul:1);
    this.color=d.color; this.sides=d.sides; this.score=d.score;
    this.rot=grnd(TAU); this.rotSpd=d.rotSpd*grnd(1.3,.7)*(grnd()<.5?-1:1);
    this.vx=0; this.vy=0; this.flash=0; this.cool=grnd(2.4,.9);
    this.birth=.55; this.wob=grnd(TAU);
    if(type==='drifter'){ const a=grnd(TAU); this.vx=Math.cos(a)*this.speed; this.vy=Math.sin(a)*this.speed; }
  }
  update(dt,p){
    if(this.birth>0){ this.birth-=dt; return; }
    this.rot+=this.rotSpd*dt;
    if(this.flash>0) this.flash-=dt;
    const dx=p.x-this.x, dy=p.y-this.y;
    const d=Math.hypot(dx,dy)||1;

    switch(this.type){
      case 'chaser':
        this.vx=lerp(this.vx,dx/d*this.speed,1-Math.pow(.06,dt));
        this.vy=lerp(this.vy,dy/d*this.speed,1-Math.pow(.06,dt));
        break;
      case 'drifter':
        if(this.x<this.r||this.x>W-this.r) this.vx*=-1;
        if(this.y<this.r||this.y>H-this.r) this.vy*=-1;
        break;
      case 'hunter': {
        this.wob+=dt*3.2;
        const perp=Math.cos(this.wob)*.55;
        const a=Math.atan2(dy,dx)+perp;
        this.vx=lerp(this.vx,Math.cos(a)*this.speed,1-Math.pow(.02,dt));
        this.vy=lerp(this.vy,Math.sin(a)*this.speed,1-Math.pow(.02,dt));
        break; }
      case 'splitter':
      case 'shard':
        this.vx=lerp(this.vx,dx/d*this.speed,1-Math.pow(.2,dt));
        this.vy=lerp(this.vy,dy/d*this.speed,1-Math.pow(.2,dt));
        break;
      case 'turret': {
        const want = d>260 ? 1 : (d<180 ? -1 : 0);
        this.vx=lerp(this.vx,dx/d*this.speed*want,1-Math.pow(.1,dt));
        this.vy=lerp(this.vy,dy/d*this.speed*want,1-Math.pow(.1,dt));
        this.cool-=dt;
        if(this.cool<=0){ this.cool=grnd(2.2,1.3); this.shoot(p); }
        break; }
      case 'boss': {
        this.vx=lerp(this.vx,dx/d*this.speed,1-Math.pow(.4,dt));
        this.vy=lerp(this.vy,dy/d*this.speed,1-Math.pow(.4,dt));
        this.cool-=dt;
        if(this.cool<=0){ this.cool=1.15; this.spray(p); }
        break; }
      case 'twin': {
        // orbita alrededor del jugador y suelta anillos giratorios
        this.orb=(this.orb===undefined?Math.atan2(-dy,-dx):this.orb)+dt*.55;
        const R=Math.min(W,H)*.34;
        const tx=clamp(p.x+Math.cos(this.orb)*R,this.r,W-this.r), ty=clamp(p.y+Math.sin(this.orb)*R,this.r,H-this.r);
        const ex=tx-this.x, ey=ty-this.y, ed=Math.hypot(ex,ey)||1;
        this.vx=lerp(this.vx,ex/ed*this.speed*Math.min(1,ed/60),1-Math.pow(.2,dt));
        this.vy=lerp(this.vy,ey/ed*this.speed*Math.min(1,ed/60),1-Math.pow(.2,dt));
        this.cool-=dt;
        if(this.cool<=0){ this.cool=1.0; this.ring(8,this.rot,220,'#4dffd2'); }
        break; }
      case 'twinHalf': {
        // mitades rapidas: zigzag hacia el jugador y rafagas de tres
        this.wob+=dt*4;
        const a=Math.atan2(dy,dx)+Math.cos(this.wob)*.8;
        this.vx=lerp(this.vx,Math.cos(a)*this.speed,1-Math.pow(.05,dt));
        this.vy=lerp(this.vy,Math.sin(a)*this.speed,1-Math.pow(.05,dt));
        this.cool-=dt;
        if(this.cool<=0){
          this.cool=grnd(1.5,1.0);
          const base=Math.atan2(dy,dx);
          for(const o of [-.16,0,.16]) Game.eShot(this.x,this.y,base+o,310,5,'#4dffd2',3);
          Audio_.tone('square',260,160,.12,.08);
        }
        break; }
      case 'ram': this.updateRam(dt,p,dx,dy); break;
    }
    this.x+=this.vx*dt; this.y+=this.vy*dt;
    this.x=clamp(this.x,this.r,W-this.r);
    this.y=clamp(this.y,this.r,H-this.r);
    if(this.isBoss) Grid.inst.pull(this.x,this.y,this.type==='twinHalf'?35:60,this.type==='twinHalf'?130:190);
  }
  /** Embestida: reposo (invoca torretas) -> apunta (linea de aviso) -> carga */
  updateRam(dt,p,dx,dy){
    if(!this.st){ this.st='rest'; this.stT=1.4; this.dir=Math.atan2(dy,dx); }
    this.stT-=dt;
    if(this.st==='rest'){
      const cx=W/2-this.x, cy=H/2-this.y, cd=Math.hypot(cx,cy)||1;
      this.vx=lerp(this.vx,cx/cd*this.speed*Math.min(1,cd/120),1-Math.pow(.1,dt));
      this.vy=lerp(this.vy,cy/cd*this.speed*Math.min(1,cd/120),1-Math.pow(.1,dt));
      this.rot=angLerp(this.rot,Math.atan2(dy,dx),1-Math.pow(.05,dt));
      if(this.stT<=0){ this.st='aim'; this.stT=1.3; this.pulseT=0; Audio_.warn(); }
    } else if(this.st==='aim'){
      this.vx*=Math.pow(.01,dt); this.vy*=Math.pow(.01,dt);
      if(this.stT>.5) this.dir=Math.atan2(dy,dx);              // sigue al jugador...
      this.rot=angLerp(this.rot,this.dir,1-Math.pow(.0005,dt)); // ...y se fija el ultimo medio segundo
      this.pulseT-=dt;
      if(this.pulseT<=0){
        // marca la linea en la cuadricula
        this.pulseT=.09;
        const L=Math.hypot(W,H), c=Math.cos(this.dir), s=Math.sin(this.dir);
        for(let k=this.r+30;k<L;k+=70){
          const x=this.x+c*k, y=this.y+s*k;
          if(x<-40||x>W+40||y<-40||y>H+40) break;
          Grid.inst.pull(x,y,this.stT<.5?34:16,58);
        }
      }
      if(this.stT<=0){ this.st='charge'; this.stT=2.5; Audio_.tone('sawtooth',120,520,.35,.18); }
    } else if(this.st==='charge'){
      const c=Math.cos(this.dir), s=Math.sin(this.dir);
      this.vx=c*1150; this.vy=s*1150; this.rot=this.dir;
      if(Math.random()<.9) Particles.spawn(this.x-c*this.r,this.y-s*this.r,-c*300+rnd(80,-80),-s*300+rnd(80,-80),.4,this.color,3);
      Grid.inst.impulse(this.x,this.y,60,120);
      const nx=this.x+this.vx*dt, ny=this.y+this.vy*dt;
      if(nx<=this.r||nx>=W-this.r||ny<=this.r||ny>=H-this.r||this.stT<=0){
        // choque contra el borde: onda, metralla e invoca torretas
        this.st='rest'; this.stT=this.hp<this.hpMax*.5?1.2:1.8;
        this.x=clamp(nx,this.r,W-this.r); this.y=clamp(ny,this.r,H-this.r);
        this.vx=-c*200; this.vy=-s*200;
        Game.shake=Math.max(Game.shake,22);
        Grid.inst.impulse(this.x,this.y,380,320);
        Particles.burst(this.x,this.y,Quality.pcount(40),this.color,420,.6);
        this.ring(10,grnd(TAU),200,this.color);
        Audio_.explode(1.4);
        const turrets=Game.enemies.filter(e=>e.type==='turret').length;
        const n=Math.min(this.hp<this.hpMax*.5?2:1, 3-turrets);
        for(let i=0;i<n;i++) Game.spawnOne('turret');
      }
    }
  }
  ring(n,off,spd,color){
    for(let i=0;i<n;i++) Game.eShot(this.x,this.y,off+i/n*TAU,spd,6,color,4);
    Audio_.tone('sawtooth',170,100,.25,.1);
  }
  shoot(p){
    const a=Math.atan2(p.y-this.y,p.x-this.x);
    Game.eBullets.push({x:this.x,y:this.y,vx:Math.cos(a)*300,vy:Math.sin(a)*300,life:3.4,r:5,color:this.color});
    Audio_.tone('sawtooth',180,120,.14,.08);
  }
  spray(p){
    const base=Math.atan2(p.y-this.y,p.x-this.x);
    for(let i=-3;i<=3;i++){
      const a=base+i*.19;
      Game.eBullets.push({x:this.x,y:this.y,vx:Math.cos(a)*270,vy:Math.sin(a)*270,life:4,r:6,color:'#ff2d78'});
    }
    Audio_.tone('sawtooth',150,90,.3,.12);
  }
  /** linea de aviso de la Embestida */
  drawWarn(ctx){
    const L=Math.hypot(W,H)*1.2, locked=this.stT<.5;
    const a=locked ? .6+.4*Math.sin(Game.time*40) : .5+.2*Math.sin(Game.time*14);
    ctx.save(); ctx.globalCompositeOperation='lighter';
    ctx.translate(this.x,this.y); ctx.rotate(this.dir);
    ctx.strokeStyle=hexA('#ff3b3b',a); ctx.lineWidth=locked?this.r*1.6:3;
    ctx.globalAlpha=locked?.34:1;
    ctx.beginPath(); ctx.moveTo(this.r,0); ctx.lineTo(L,0); ctx.stroke();
    ctx.globalAlpha=1; ctx.lineWidth=2; ctx.setLineDash([14,10]); ctx.lineDashOffset=-Game.time*120;
    ctx.strokeStyle=hexA('#ff5050',Math.min(1,a+.3));
    for(const o of [-this.r*.8,this.r*.8]){ ctx.beginPath(); ctx.moveTo(this.r,o); ctx.lineTo(L,o); ctx.stroke(); }
    ctx.restore();
  }
  hit(dmg){
    this.hp-=dmg; this.flash=.09;
    Audio_.enemyHit();
    return this.hp<=0;
  }
  draw(ctx){
    if(this.birth>0){
      const t=1-this.birth/.55;
      ctx.save(); ctx.globalAlpha=t*.9;
      drawPoly(ctx,this.x,this.y,this.r*(2.4-t*1.4),this.sides,this.rot,this.color,null,1.4);
      ctx.restore(); return;
    }
    const col = this.flash>0 ? '#ffffff' : this.color;
    drawPoly(ctx,this.x,this.y,this.r,this.sides,this.rot,col,'rgba(6,10,24,.72)',this.type==='boss'?3.8:2.7);
    if(this.type==='boss'){
      drawPoly(ctx,this.x,this.y,this.r*.58,3,-this.rot*1.7,col,null,2.4);
    } else if(this.type==='twin'||this.type==='twinHalf'){
      drawPoly(ctx,this.x,this.y,this.r*.62,4,-this.rot*2+Math.PI/4,col,null,2.2);
      if(this.type==='twin'){
        // la costura por donde se va a partir
        ctx.save(); ctx.translate(this.x,this.y); ctx.rotate(this.rot+Math.PI/4);
        ctx.strokeStyle=hexA('#4dffd2',.5+.4*Math.sin(Game.time*8)); ctx.lineWidth=2; ctx.setLineDash([6,6]);
        ctx.beginPath(); ctx.moveTo(0,-this.r*.7); ctx.lineTo(0,this.r*.7); ctx.stroke(); ctx.restore();
      }
    } else if(this.type==='ram'){
      drawPoly(ctx,this.x,this.y,this.r*.5,3,this.rot,col,null,2.2);
      if(this.st==='aim') this.drawWarn(ctx);
    } else if(this.type==='turret'){
      drawPoly(ctx,this.x,this.y,this.r*.5,4,this.rot*-2,col,null,1.6);
    }
  }
}

/** Copia texto al portapapeles (con plan B para navegadores viejos o sin HTTPS). */
async function copyText(t){
  try{ if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(t); return true; } }catch(e){}
  try{
    const ta=document.createElement('textarea');
    ta.value=t; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    const ok=document.execCommand('copy'); ta.remove(); return ok;
  }catch(e){ return false; }
}

/* ============================================================
   CALIDAD ADAPTATIVA
   Mide los fotogramas reales y baja el detalle sola si hace falta.
   ============================================================ */
const Quality = {
  level:2, acc:0, n:0, drops:0,
  pcount(n){ return Math.max(2, Math.round(n * (this.level===2?1:this.level===1?.7:.45))); },
  gridPad(){ return this.level===2?0:this.level===1?14:30; },
  bloomPasses(){ return this.level===2?2:1; },
  dprCap(){
    const base = IS_COARSE ? 1.25 : 2;
    return this.level===2 ? base : this.level===1 ? base*.8 : base*.6;
  },
  tick(dt){
    if(this.drops>=2 || Game.state!=='playing') return;
    this.acc+=dt; this.n++;
    if(this.n>=90){
      const avg=this.acc/this.n;
      this.acc=0; this.n=0;
      if(avg > 1/38){
        this.level--; this.drops++;
        resize(); Grid.inst.build();
      }
    }
  }
};
